<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResearchHub for Statistics</title>
<meta name="description" content="A twelve-slide overview of ResearchHub, a student-built research collaboration app, and a proposed pilot in the Purdue Department of Statistics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* ================= Tokens (single committed theme) ================= */
:root{
  color-scheme: light;
  --black:#000000; --ink:#121214; --paper:#FFFFFF; --wash:#F4F3F3; --steel:#555960; --rule:#D8D6D6;
  --gold:#CFB991; --aged:#86683A; --rush:#DAAA00;
  --on-black:#FFFFFF; --on-black-2:#B9BBC0; --on-black-gold:#CFB991; --black-rule:#2E2E31;
  --ok:#2E7D4F; --ok-tint:#EEF6F1; --ok-line:#BFD8C8;
  --gap:#B3261E; --gap-tint:#FBEFEE; --gap-line:#E7C3C0;
  --surround:#0B0B0C; --bar-line:#1E1E21;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --label:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --sans:"Libre Franklin", "Franklin Gothic Medium", "Franklin Gothic", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--surround);color:var(--on-black)}
body{margin:0;font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0}
img{max-width:100%}
button{font:inherit}
:focus-visible{outline:3px solid var(--rush);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
kbd{font-family:var(--mono);font-size:12px;line-height:1.4;border:1px solid #3A3A3E;border-bottom-width:2px;padding:0 6px;background:#1A1A1D;color:#FFFFFF;white-space:nowrap}
.offline{max-width:560px;margin:15vh auto 0;padding:0 16px;color:#FFFFFF;font-size:18px;line-height:1.5}
.offline-title{font-family:var(--serif);font-size:40px;font-weight:600;margin-bottom:12px}
.offline p + p{color:#B9BBC0}
.nw{white-space:nowrap}

/* ================= Slide system (1600 x 900 logical stage) ================= */
.slide{
  --f-hero:124px; --f-h2:60px; --f-h2s:52px; --f-h3:30px; --f-lead:30px; --f-body:26px;
  --f-small:22px; --f-fine:20px; --f-label:21px; --f-chip:18px; --f-fig:84px; --f-mono:20px;
  position:relative;width:1600px;height:900px;overflow:hidden;
  display:flex;flex-direction:column;padding:60px 104px 0;
  font-size:var(--f-body);line-height:1.4;
}
.slide.content{background:var(--paper);color:var(--ink)}
.slide.chapter{background:var(--black);color:var(--on-black)}
.gold-rule{position:absolute;left:0;right:0;top:0;height:6px;background:var(--gold)}
.slide-main{flex:1;min-height:0;display:flex;flex-direction:column}
.slide-foot{flex:none;height:56px;margin-top:16px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:14px;font-size:var(--f-fine);color:var(--steel)}
.slide-foot .wm{font-family:var(--serif);font-weight:600;color:var(--ink)}
.slide-foot > span{white-space:nowrap}
.slide-foot > span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis}
.slide-foot .foot-n{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums}
.chapter .slide-foot{border-top-color:var(--black-rule);color:var(--on-black-2)}
.chapter .slide-foot .wm{color:var(--on-black)}

.eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:16px;font-family:var(--label);font-weight:600;font-size:var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--steel);line-height:1.2}
.chapter .eyebrow{color:var(--on-black-2)}
.tag{display:inline-flex;align-items:center;padding:4px 12px 3px;font-family:var(--label);font-weight:600;font-size:var(--f-label);letter-spacing:.08em;text-transform:uppercase;line-height:1.15;border:2px solid transparent;white-space:nowrap}
.tag-today{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.tag-proposed{background:transparent;border:2px dashed var(--aged);color:var(--aged)}
.chapter .tag-proposed{border-color:var(--gold);color:var(--gold)}
.tag-sm{font-size:var(--f-chip);padding:2px 9px 1px}

.title{font-family:var(--serif);font-weight:600;font-size:var(--f-h2);line-height:1.06;letter-spacing:-.012em;margin-top:18px;text-wrap:balance}
.title.sm{font-size:var(--f-h2s)}
.lead{font-size:var(--f-lead);line-height:1.35;margin-top:18px;max-width:40em;text-wrap:pretty}
.sub{font-size:var(--f-small);line-height:1.4;color:var(--steel);margin-top:14px;text-wrap:pretty}
.chapter .sub{color:var(--on-black-2)}
.fine{font-size:var(--f-fine);line-height:1.4;color:var(--steel)}
.chapter .fine{color:var(--on-black-2)}
.num{font-variant-numeric:tabular-nums lining-nums}

/* status tokens */
.tok{display:inline-block;font-family:var(--mono);font-weight:500;font-size:var(--f-mono);line-height:1.35;padding:1px 8px;background:var(--wash);border:1px solid var(--rule);color:var(--ink);white-space:nowrap}
.tok.ok{color:var(--ok);background:var(--ok-tint);border-color:var(--ok-line)}
.tok.gap{color:var(--gap);background:var(--gap-tint);border-color:var(--gap-line)}
.tok.plain{background:transparent}

/* bullets */
.points{list-style:none;display:flex;flex-direction:column;gap:22px;margin-top:36px}
.points li{position:relative;padding-left:30px;line-height:1.38;text-wrap:pretty}
.points li::before{content:"";position:absolute;left:0;top:.46em;width:12px;height:12px;background:var(--gold)}

/* ================= Screenshot window frame ================= */
.shot{border:1px solid var(--rule);background:var(--paper);display:flex;flex-direction:column;min-width:0}
.shot-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;height:40px;padding:0 14px;background:var(--wash);border-bottom:1px solid var(--rule)}
.role{font-family:var(--label);font-weight:600;font-size:var(--f-chip);letter-spacing:.08em;text-transform:uppercase;line-height:1.2;padding:2px 9px 1px;background:var(--ink);color:#FFFFFF}
.shot-note{font-family:var(--label);font-weight:500;font-size:var(--f-chip);letter-spacing:.06em;text-transform:uppercase;color:var(--steel);white-space:nowrap}
.shot-view{position:relative;overflow:hidden;background:#232325}
.shot-view img{display:block;width:100%;height:auto}
.shot-view img.crop{max-width:none}
.shot figcaption{padding:10px 14px 11px;font-size:var(--f-fine);line-height:1.35;color:var(--steel);border-top:1px solid var(--rule);background:var(--paper)}
.shot-missing{height:100%;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;font-size:18px;line-height:1.35;color:var(--steel);background:repeating-linear-gradient(135deg,#F4F3F3 0 14px,#ECEBEB 14px 28px)}
.shot-missing strong{font-family:var(--label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.shot-missing code{font-family:var(--mono);font-size:16px;color:var(--ink);overflow-wrap:anywhere}
.shot-missing.fill{position:absolute;inset:0;height:auto;min-height:0;overflow:hidden}
.s6-thumbs .shot-missing{gap:4px;padding:8px 10px;font-size:15px}
.s6-thumbs .shot-missing code{font-size:12px}
.chapter .shot{border-color:var(--black-rule);background:var(--ink)}
.chapter .shot-bar{background:var(--ink);border-bottom-color:var(--black-rule)}
.chapter .role{background:var(--gold);color:var(--ink)}
.chapter .shot-note{color:var(--on-black-2)}
.chapter .shot figcaption{background:var(--ink);color:var(--on-black-2);border-top-color:var(--black-rule)}

/* ================= 1 · Title ================= */
.s1-copy{position:absolute;left:104px;top:6px;bottom:0;width:660px;display:flex;flex-direction:column;justify-content:center;gap:30px}
.s1-eyebrow{font-family:var(--label);font-weight:600;font-size:26px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-black-gold)}
.s1 h1{font-family:var(--serif);font-weight:600;font-size:var(--f-hero);line-height:.95;letter-spacing:-.022em;color:var(--on-black)}
.s1-line{font-family:var(--serif);font-weight:400;font-size:42px;line-height:1.18;color:var(--on-black);max-width:13.5em;text-wrap:balance}
.s1-meta{font-size:var(--f-small);color:var(--on-black-2);border-top:1px solid var(--black-rule);padding-top:22px;max-width:560px}
.s1-meta-l{display:block}
.s1-shot{position:absolute;left:808px;top:218px;width:688px}
.s1-shot .shot-bar{justify-content:flex-start}

/* ================= 2 · The gap ================= */
.s2-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px;margin-block:auto;padding-top:40px}
.s2-col{border-top:3px dashed var(--rule);padding-top:26px;display:flex;flex-direction:column}
.s2-col h3{font-family:var(--label);font-weight:600;font-size:30px;letter-spacing:.08em;text-transform:uppercase;color:var(--aged)}
.s2-col p{flex:1 0 auto;margin-top:14px;line-height:1.45;text-wrap:pretty}
.scatter{display:flex;flex-wrap:wrap;gap:10px 12px;margin-top:26px}
.scatter span{font-family:var(--label);font-weight:500;font-size:var(--f-chip);letter-spacing:.06em;text-transform:uppercase;color:var(--steel);border:1px dashed #B9B7B7;padding:3px 10px 2px}
.scatter span:nth-child(2n){position:relative;top:8px}
.s2-note{padding-top:20px}

/* ================= 3 · Lifecycle rail ================= */
.rail{display:grid;grid-template-columns:minmax(0,3fr) 44px minmax(0,4fr);margin-top:44px}
.rail-grp{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));align-content:start}
.rail-label{grid-column:1 / -1;display:flex;align-items:center;gap:4px;height:42px;margin-bottom:16px;font-family:var(--label);font-weight:600;font-size:var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}
.rail-label .tok{font-size:18px;margin-left:4px;text-transform:none;letter-spacing:0}
.stage-item{position:relative;padding-right:14px}
.stage-item::before{content:"";position:absolute;left:0;right:0;top:22px;height:3px;background:var(--gold)}
.rail-grp.work .stage-item:last-child::before{right:auto;width:48px}
.stage-num{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:3px solid var(--gold);font-family:var(--serif);font-weight:600;font-size:24px;line-height:1}
.work .stage-num{background:var(--gold)}
.stage-item h3{font-family:var(--serif);font-weight:600;font-size:var(--f-h3);line-height:1.1;margin-top:20px;white-space:nowrap}
.reading .stage-item h3{white-space:normal}
.stage-item p{font-size:var(--f-fine);line-height:1.38;min-height:calc(5 * 1.38em);color:var(--steel);margin-top:8px;text-wrap:pretty}
.stage-item .toks{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:14px}
.rail-gate{position:relative}
.rail-gate::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:4px;background:var(--ink)}
.s3-note{margin-top:auto;padding-top:18px}

/* ================= 4 / 5 · Split with screens ================= */
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 680px;gap:60px}
.split-copy{display:flex;flex-direction:column;min-width:0;min-height:0}
.split-copy .lead{font-size:var(--f-small);line-height:1.4;margin-top:14px;color:var(--steel)}
.split-copy .points{margin-top:24px;gap:16px;font-size:24px;min-height:0;overflow:hidden}
.split-shots{display:flex;flex-direction:column;gap:18px;min-width:0}
.split-copy .fine{margin-top:auto;padding-top:16px;border-top:1px solid var(--rule)}

/* ================= 6 · Story ================= */
.s6{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:56px}
.s6-copy{display:flex;flex-direction:column;min-width:0}
.story{list-style:none;margin-top:22px;display:flex;flex-direction:column}
.story li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:18px;align-items:start;padding:5px 0 6px;border-top:1px solid var(--rule)}
.story li:last-child{border-bottom:1px solid var(--rule)}
.story .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#FFFFFF;font-family:var(--serif);font-weight:600;font-size:19px;line-height:1;margin-top:3px}
.story .k{display:block;font-family:var(--label);font-weight:600;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--aged);line-height:1.2}
.story .t{display:block;font-size:var(--f-fine);line-height:1.36;margin-top:2px;text-wrap:pretty}
.story .tok{font-size:17px;padding:0 6px;margin-left:2px}
.s6-thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-content:start}
.s6-thumbs .shot figcaption{font-size:18px}

/* ================= 7 · Value ================= */
.s7{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;margin-top:28px;align-items:start}
.s7-today{display:flex;flex-direction:column}
.item{padding:16px 0 18px;border-top:1px solid var(--rule)}
.item h3{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.15;margin-top:10px}
.item p{font-size:var(--f-small);line-height:1.4;color:var(--steel);margin-top:8px;text-wrap:pretty}
.s7-prop{border:2px dashed var(--aged);padding:4px 30px 8px;background:#FBFAF7}
.s7-prop .item:first-child{border-top:0}
.s7-note{margin-top:auto;padding-top:14px}

/* ================= 8 · Evidence ================= */
.figs{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:56px;margin-top:32px}
.grp-h{font-family:var(--label);font-weight:600;font-size:var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--steel);border-top:3px solid var(--ink);padding-top:12px}
.fig-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:0 24px;margin-top:14px}
.fig{display:flex;flex-direction:column;min-width:0}
.fig .v{font-family:var(--serif);font-weight:600;font-size:var(--f-fig);line-height:1;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.fig .k{font-family:var(--label);font-weight:600;font-size:var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--steel);margin-top:8px}
.checks{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:56px;margin-top:30px}
.ratio{display:flex;align-items:baseline;gap:14px;margin-top:12px}
.ratio .v{font-family:var(--mono);font-weight:500;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.ratio .k{font-size:var(--f-small);color:var(--steel)}
.squares{display:grid;grid-template-columns:repeat(var(--cols, 24),20px);gap:6px;margin-top:16px}
.sq{display:inline-block;width:20px;height:20px;background:var(--ok);vertical-align:-3px}
.sq.miss{background:#FFFFFF;border:3px solid var(--gap);background-image:linear-gradient(45deg,transparent 42%,var(--gap) 42%,var(--gap) 58%,transparent 58%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;font-size:var(--f-fine);color:var(--steel)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend .sq{width:16px;height:16px;vertical-align:0}
.legend .sq.miss{border-width:2px}
.s8-note{margin-top:auto;display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:56px;padding-top:18px;font-size:var(--f-small);line-height:1.4}
.s8-note p{text-wrap:pretty}

/* ================= 9 · AI chapter ================= */
.s9-head{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:44px;align-items:end;margin-top:4px}
.s9-head .title{color:var(--on-black)}
.s9-lead{grid-column:2 / -1;font-size:var(--f-small);line-height:1.42;color:var(--on-black-2);text-wrap:pretty}
.s9-lead strong{color:var(--on-black);font-weight:600}
.assist{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 44px;margin-top:34px}
.a-cell{border-top:1px solid var(--black-rule);padding:16px 0 18px}
.a-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.a-name{font-family:var(--serif);font-weight:600;font-size:var(--f-h3);line-height:1.15;color:var(--on-black)}
.who{font-family:var(--label);font-weight:600;font-size:var(--f-chip);letter-spacing:.08em;text-transform:uppercase;line-height:1.2;padding:2px 8px 1px;white-space:nowrap}
.who.faculty{background:var(--gold);color:var(--ink);border:1px solid var(--gold)}
.who.student{background:transparent;color:var(--on-black-gold);border:1px solid var(--gold)}
.a-draft{font-size:var(--f-fine);color:var(--on-black-2);margin-top:8px;line-height:1.35;min-height:calc(2 * 1.35em)}
.a-dec{font-size:var(--f-fine);color:var(--on-black);margin-top:6px;line-height:1.35}
.a-dec b{font-family:var(--label);font-weight:600;font-size:var(--f-chip);letter-spacing:.08em;text-transform:uppercase;color:var(--on-black-gold);margin-right:4px}
.s9-bound{display:flex;align-items:center;flex-wrap:wrap;gap:12px 20px;margin-top:24px;padding:14px 0;border-top:2px solid var(--gold);border-bottom:1px solid var(--black-rule)}
.s9-bound .bk{display:inline-flex;align-items:center;gap:12px;font-family:var(--label);font-weight:600;font-size:var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--on-black-gold)}
.xmark{display:inline-block;width:22px;height:22px;border:3px solid #E0584E;background-image:linear-gradient(45deg,transparent 40%,#E0584E 40%,#E0584E 60%,transparent 60%),linear-gradient(-45deg,transparent 40%,#E0584E 40%,#E0584E 60%,transparent 60%)}
.s9-bound .items{font-size:var(--f-small);color:var(--on-black)}
.s9-note{margin-top:18px;max-width:1180px}

/* ================= 10 · Visual concept ================= */
.s10{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px;margin-top:28px;align-items:stretch}
.s10 > div{display:flex;flex-direction:column;min-width:0}
.s10-h{display:flex;align-items:center;gap:14px;margin-bottom:14px;font-family:var(--label);font-weight:600;font-size:var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.s10 .shot{flex:1 1 auto}
.s10 .shot-view{flex:1 1 auto;display:flex;flex-direction:column;background:#2A2A2A}
.s10 .shot-missing{flex:1 1 auto}
.s10-cap{margin-top:auto;padding-top:12px;font-size:var(--f-fine);color:var(--steel);line-height:1.38}
.mock{border:1px solid var(--rule);background:var(--paper);color:var(--ink);font-family:var(--sans)}
.mk-mast{display:flex;align-items:center;gap:16px;height:58px;padding:0 20px;background:var(--black);color:#FFFFFF}
.mk-wm{font-family:var(--serif);font-weight:600;font-size:24px}
.mk-dept{font-family:var(--label);font-weight:600;font-size:16px;letter-spacing:.12em;color:var(--gold);border-left:1px solid #3A3A3E;padding-left:14px;line-height:1.6}
.mk-nav{margin-left:auto;display:flex;gap:18px;font-size:16px;color:#B9BBC0}
.mk-nav .on{color:#FFFFFF;box-shadow:inset 0 -3px 0 var(--gold);padding-bottom:4px}
.mk-body{padding:16px 22px 18px}
.mk-crumb{font-size:16px;color:var(--steel)}
.mk-title{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.15;margin-top:4px}
.mk-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px;border-bottom:1px solid var(--rule)}
.mk-tabs span{font-size:16px;font-weight:500;color:var(--steel);padding:7px 12px 6px}
.mk-tabs .on{background:var(--gold);color:var(--ink);font-weight:600}
.mk-task{display:grid;grid-template-columns:minmax(0,1fr) 120px 142px;gap:16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule)}
.mk-name{font-size:18px;font-weight:600;line-height:1.25}
.mk-who{font-size:16px;color:var(--steel);margin-top:2px}
.mk-prog{display:flex;align-items:center;gap:10px}
.mk-bar{flex:1;height:8px;background:var(--wash);border:1px solid var(--rule);position:relative;overflow:hidden}
.mk-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}

.st-dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.st-prog{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}

.mk-st.done{color:var(--ok)}
.mk-st.review{color:var(--aged)}

/* ================= 11 · Phases ================= */
.brackets{display:grid;grid-template-columns:5fr 1fr 1fr;margin-top:46px;font-family:var(--label);font-weight:600;font-size:var(--f-chip);letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}

.phases{list-style:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:22px}
.phase{position:relative;padding-right:18px}
.phase::before{content:"";position:absolute;left:0;right:0;top:34px;height:3px;background:var(--ink)}

.ph-n{position:relative;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink);font-family:var(--serif);font-weight:600;font-size:34px;line-height:1}
.phase.pilot .ph-n{background:var(--gold)}
.phase.launch .ph-n{background:var(--ink);color:#FFFFFF}
.ph-t{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.12;min-height:calc(2 * 1.12em);margin-top:20px;text-wrap:balance}

.s11-note{margin-top:auto;padding-top:14px;border-top:1px solid var(--rule)}

/* ================= 12 · Close ================= */
.s12{display:grid;grid-template-columns:560px minmax(0,1fr);gap:88px;margin-top:0;align-items:start}
.s12 .title{font-size:76px;color:var(--on-black)}
.s12-close{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.25;color:var(--on-black);margin-top:36px;padding-top:28px;border-top:2px solid var(--gold);text-wrap:pretty}
.steps{list-style:none;display:flex;flex-direction:column;margin-top:8px}
.steps li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:24px;padding:24px 0;border-top:1px solid var(--black-rule)}
.steps li::before{content:"";width:14px;height:14px;background:var(--gold);margin-top:12px}
.steps h3{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.15;color:var(--on-black)}
.steps p{font-size:var(--f-small);line-height:1.4;color:var(--on-black-2);margin-top:6px}
.s12-foot{margin-top:auto;margin-bottom:34px;padding-top:16px;border-top:1px solid var(--black-rule);text-wrap:balance}

/* ================= Presentation shell ================= */
.deck{position:fixed;inset:0;overflow:hidden;background:var(--surround)}
.viewport{position:absolute;inset:0;touch-action:pan-y pinch-zoom}
.stage{position:absolute;width:1600px;height:900px;transform-origin:0 0;box-shadow:0 0 0 1px #1E1E21}
.page{position:absolute;inset:0}
.stage .page{pointer-events:none}
.stage .slide{opacity:0;visibility:hidden;transition:opacity .26s ease,transform .26s ease,visibility 0s linear .26s}
.stage .slide.is-before{transform:translateX(-28px)}
.stage .slide.is-after{transform:translateX(28px)}
.stage .slide.is-current{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .26s ease,transform .26s ease,visibility 0s}

.bar{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:10;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:0 16px;background:var(--surround);border-top:1px solid var(--bar-line);color:#FFFFFF}

.count b{color:#FFFFFF;font-weight:500}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;min-width:36px;padding:0 10px;border:1px solid #2E2E31;border-radius:0;background:transparent;color:#FFFFFF;cursor:pointer;font-family:var(--label);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;line-height:1}
.btn:hover{border-color:var(--gold)}
.btn[aria-pressed="true"],.btn[aria-expanded="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.35;cursor:default;border-color:#2E2E31}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn .lbl{display:inline}
@media (max-width: 980px){ .btn .lbl{display:none} .bar-sub{display:none} }

.notes{position:fixed;left:0;right:0;bottom:56px;z-index:9;overflow:auto;background:#121214;border-top:1px solid #2E2E31;color:#E6E6E8;padding:12px max(16px, calc((100vw - 1040px) / 2))}
.notes-k{font-family:var(--label);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-right:10px;white-space:nowrap}
.notes p.nt{font-size:17px;line-height:1.5;max-width:82ch}

.help{position:fixed;right:16px;bottom:68px;z-index:20;width:min(320px, calc(100vw - 32px));background:#121214;border:1px solid #2E2E31;color:#FFFFFF;padding:14px 18px 12px}
.help h2{font-family:var(--label);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}

.overview{position:fixed;inset:0;z-index:30;overflow:auto;scrollbar-gutter:stable;background:#0B0B0C;padding:18px 24px 40px}

.ov-title{font-family:var(--serif);font-weight:600;font-size:26px;color:#FFFFFF}
.ov-grid{list-style:none;display:grid;gap:22px 20px;justify-content:center}
.thumb{position:relative;display:flex;flex-direction:column}
.thumb-view{display:block;position:relative;overflow:hidden;background:#FFFFFF;outline:1px solid #2E2E31}

.thumb-inner{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.thumb-label{display:flex;gap:8px;padding-top:8px;font-size:14px;line-height:1.3;color:#B9BBC0}
.thumb-label b{font-family:var(--mono);font-weight:500;color:var(--gold)}
.thumb-hit{position:absolute;inset:-4px;border:0;background:transparent;cursor:pointer;padding:0}
.thumb:hover .thumb-view{outline:2px solid var(--gold)}

/* ================= Reading mode (narrow screens) ================= */
.reading-root{min-height:100vh;background:var(--surround)}
.rbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:50px;padding:0 16px;background:var(--surround);border-bottom:2px solid var(--gold)}
.rbar .bar-sub{display:inline;margin-right:auto}
.reading-list{display:flex;flex-direction:column;gap:14px;padding:14px 0 40px;width:min(100%, 880px);margin-inline:auto}
.reading .page{position:static}
.rnotes{background:#121214;color:#E6E6E8;padding:12px 16px 14px;border-top:1px solid #2E2E31}
.rnotes p.nt{font-size:15px;line-height:1.55}
.reading .slide{
  --f-hero:58px; --f-h2:30px; --f-h2s:28px; --f-h3:21px; --f-lead:19px; --f-body:17px;

}
.reading .slide-foot{height:44px;margin-top:26px;gap:10px}
.reading .s1{padding-bottom:28px}
.reading .s1-copy{position:static;width:auto;gap:18px}
.reading .s1-eyebrow{font-size:15px}

.reading .stage-item p{min-height:0}

.reading .stage-item::before,.reading .rail-grp.work .stage-item:last-child::before{left:20px;right:auto;top:0;bottom:0;width:3px;height:auto}

.reading .stage-num{grid-row:1 / span 3;width:42px;height:42px;font-size:19px}

.reading .shot-bar{height:34px;padding:0 10px}
.reading .s6{gap:22px}

.reading .s6-thumbs .shot figcaption{font-size:14px}
.reading .story .k{font-size:13px}
.reading .story .tok{font-size:12px}
.reading .s7{gap:22px;margin-top:20px}
.reading .item h3{font-size:21px}

.reading .fig-row{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px 20px}
.reading .figs,.reading .checks{gap:26px;margin-top:24px}
.reading .ratio .v{font-size:34px}
.reading .squares{grid-template-columns:repeat(auto-fill,14px);gap:5px}
.reading .squares .sq{width:14px;height:14px}
.reading .sq.miss{border-width:2px}
.reading .s8-note{gap:14px;margin-top:22px}
.reading .s9-head{gap:14px}
.reading .s9-lead{grid-column:auto}
.reading .a-draft{min-height:0}
.reading .assist{margin-top:20px}
.reading .a-top{flex-wrap:wrap}
.reading .s9-bound .items{font-size:15px}
.reading .s9-note{margin-bottom:26px}
.reading .s10{gap:28px;margin-top:20px}
.reading .mk-mast{height:auto;padding:10px 12px;flex-wrap:wrap;gap:8px 12px}
.reading .mk-wm{font-size:19px}
.reading .mk-nav{margin-left:0;width:100%;gap:12px;font-size:13px;flex-wrap:wrap}
.reading .mk-body{padding:12px}
.reading .mk-title{font-size:19px}
.reading .mk-tabs span{font-size:13px;padding:5px 8px}
.reading .mk-task{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
.reading .mk-task .mk-prog{grid-column:1 / -1;order:3}
.reading .mk-name{font-size:15px}
.reading .brackets{display:none}
.reading .phases{grid-template-columns:minmax(0,1fr);margin-top:24px}
.reading .phase{display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:14px;padding:0 0 18px}
.reading .phase::before,.reading .phase:last-child::before{left:24px;right:auto;top:0;bottom:0;width:3px;height:auto}
.reading .phase:last-child::before{bottom:auto;height:26px}
.reading .ph-n{grid-row:1 / span 2;width:50px;height:50px;font-size:22px}

@media (prefers-reduced-motion: reduce){
  .stage .slide,.stage .slide.is-before,.stage .slide.is-after,.stage .slide.is-current{transition:none!important;transform:none!important}
  .progress span{transition:none}
}

/* ================= Print: one landscape page per slide ================= */
@media print{
  @page{size:16in 9in;margin:0}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{background:#FFFFFF!important;height:auto!important;overflow:visible!important}
  .bar,.notes,.help,.overview,.rbar,.rnotes,.sr-only,.noscript-msg{display:none!important}
  .deck,.viewport{position:static!important;inset:auto!important;overflow:visible!important;height:auto!important}
  .stage{position:static!important;transform:none!important;width:auto!important;height:auto!important;box-shadow:none!important}
  .page{position:relative!important;inset:auto!important;width:16in!important;height:9in!important;overflow:hidden!important;break-after:page;page-break-after:always;break-inside:avoid}
  .page:last-child{break-after:auto;page-break-after:auto}
  .page > .slide{opacity:1!important;visibility:visible!important;transition:none!important;transform:scale(.96)!important;transform-origin:0 0!important}
}

<script>

function imgSrc(name) {

}
// === end of IMAGE LOCATION ===

(function () {

    { title: "One project, start to finish", ground: "content", cls: "sl-6", C: S6,
      notes: "Here is one fictional project from the demo run. Avery finds Dr. Chen’s project and applies, and is accepted along with Jordan while Sam is still interviewing. Avery passes the five-question project quiz with 80 percent, submits validation notes on a task at 4 of 6, and Dr. Chen approves them with a comment. The conversation continues in project messages. The quiz here is a fixed demo question set; no AI was called in this run." },
    { title: "What it gives the department", ground: "content", cls: "sl-7", C: S7,
      notes: "Three things are true today: one front door for student research, student documents that are never public files, and records that build up as the work happens, though no screen summarizes them yet. Two things are proposed: invite-only Statistics membership, so only invited faculty and students take part, and department-run access, where an operator manages invitations and memberships. University sign-in arrives with the department launch. Known access gaps are closed first, in Phases 0 and 1." },
    { title: "It already runs", ground: "content", cls: "sl-8", C: S8,
      notes: "This is a working app, not a mockup: 20 pages, 77 API operations and 17 data tables. Against a fictional cohort of 6 faculty and 12 students, 46 of 47 API checks and 8 of 10 browser checks passed. The three failures each record a real gap. A separate source review found more issues, including access and reliability gaps, and the roadmap fixes them before any pilot. No AI key was set, so no AI calls were made. An estimated 11 to 13 Purdue students built the app across two semesters." },
    { title: "AI help, with people in charge", ground: "chapter", cls: "sl-9", C: S9, foot: false,
      notes: "Later in the plan, after the readiness, membership and interface work, we propose optional AI help on Purdue GenAI Studio. Anyone who wants it connects their own key, with no shared key and no fallback to anyone else’s. Today the app’s two AI features share one server-wide key. Six assistants would draft project briefs, quizzes, work plans, feedback, method explanations and self-checks, and every one of them stops for a person to decide. None of this is built yet; the design reuses patterns from Scriptorium, a separate project." },
    { title: "Interface refresh", ground: "content", cls: "sl-10", C: S10,
      notes: "On the left is today’s faculty Task Log. On the right is a concept of the same workspace in a style based on Purdue’s brand colors and type: a black masthead, a gold selected tab, and task status written in words. It uses four of the same demo tasks. It is a design direction, not a built screen, and any official university lockup would be obtained, never drawn." },
    { title: "Path to a pilot", ground: "content", cls: "sl-11", C: S11,
      notes: "The plan runs in seven phases. Phase 0 closes known security and reliability gaps in the current app, and Phase 1 draws the Statistics boundary. Phases 2 through 4 refresh the interface and add personal AI connections and reliable assistant runs. Phase 5 is the pilot with faculty and students, and Phase 6 is the department launch. No dates are committed until hosting and sign-in are chosen." },
    { title: "What it would take", ground: "chapter", cls: "sl-12", C: S12, foot: false,
      notes: "Four decisions would move this forward: sign-in and hosting, a department owner for membership, a pilot group, and shared expectations for student documents and AI use. The core workflow already runs end to end. What remains is closing known gaps, the department boundary, dependable hosting, the interface refresh, and optional AI help that keeps people in charge." }
  ];
  const TOTAL = SLIDES.length;

  function Slide({ slide, n, total, state, hidden, asThumb }) {
    const C = slide.C;
    const El = asThumb ? "div" : "section";
    const a11y = asThumb ? {} : {
      "aria-roledescription": "slide",
      "aria-label": n + " of " + total + ": " + slide.title,
      id: "slide-" + n
    };
    const cls = ["slide", slide.ground, slide.cls, state].filter(Boolean).join(" ");
    return html`<${El} className=${cls} ...${a11y}
        aria-hidden=${hidden ? "true" : undefined} inert=${hidden ? "" : undefined}>
      ${slide.ground === "chapter" ? html`<div className="gold-rule" aria-hidden="true"></div>` : null}
      ${slide.cls === "s1" ? html`<${C} />` : html`<div className="slide-main"><${C} /></div>`}
      ${slide.foot === false ? null : html`<footer className="slide-foot">
        <span className="wm">ResearchHub</span><span>Proposed Statistics pilot</span>
        <span className="foot-n">${n} / ${total}</span>
      </footer>`}
    <//>`;
  }

  /* ==================================================================
     DECK MECHANICS
     ================================================================== */
  const THUMB_MODE = { reading: false, thumb: true };
  const READ_MODE = { reading: true, thumb: false };
  const READING_QUERY = "(max-width: 759px), (max-height: 540px), (orientation: portrait) and (max-width: 1024px)";
  const clamp = (i) => Math.max(0, Math.min(TOTAL - 1, i));
  function hashIndex() {
    const m = /^#(\d+)$/.exec(window.location.hash || "");
    return m ? clamp(parseInt(m[1], 10) - 1) : 0;
  }
  function mql(q) { try { return window.matchMedia(q); } catch (e) { return null; } }
  function onMq(m, fn) {
    if (!m) return function () {};
    if (m.addEventListener) { m.addEventListener("change", fn); return () => m.removeEventListener("change", fn); }
    m.addListener(fn); return () => m.removeListener(fn);
  }
  function readKeysPref() { try { return localStorage.getItem("rh-keys") !== "off"; } catch (e) { return true; } }

  const KEYS = [
    [["→", "Space", "PgDn"], "Next slide"],
    [["←", "Shift+Space", "PgUp"], "Previous slide"],
    [["Home", "End"], "First / last slide"],
    [["O"], "All slides"],
    [["N"], "Speaker notes"],
    [["F"], "Full screen"],
    [["Esc"], "Close a panel"],
    [["?"], "This list"]
  ].filter((r) => CAN_FS || r[1] !== "Full screen");
  function Help({ keysOn, setKeysOn }) {
    return html`<div className="help" id="help-pop" role="region" aria-label="Keyboard shortcuts">
      <h2>Keyboard shortcuts</h2>
      <dl>
        ${KEYS.map(([ks, d]) => html`<div key=${d}><dt>${ks.map((k) => html`<kbd key=${k}>${k}</kbd>`)}</dt><dd>${d}</dd></div>`)}
        <div><dt>Swipe</dt><dd>Next / previous on touch screens</dd></div>
      </dl>
      <label className="keys-toggle">
        <input type="checkbox" checked=${keysOn} onChange=${(e) => setKeysOn(e.target.checked)} />
        <span>Single-letter shortcuts (${CAN_FS ? "O, N, F, ?" : "O, N, ?"})</span>
      </label>
    </div>`;
  }

  function Overview({ idx, vw, onPick, onClose }) {
    const ref = useRef(null);
    const [cw, setCw] = useState(vw);
    useLayoutEffect(() => { if (ref.current) setCw(ref.current.clientWidth); }, [vw]);
    const cols = vw >= 1180 ? 4 : vw >= 820 ? 3 : 2;
    const gridW = Math.min(cw - 48, 1360);
    const tw = Math.floor((gridW - (cols - 1) * 20) / cols);
    const th = Math.round((tw * 9) / 16);
    useEffect(() => {
      const el = ref.current && ref.current.querySelector(".thumb.cur .thumb-hit");
      if (el) el.focus();
    }, []);
    return html`<div className="overview" role="dialog" aria-modal="true" aria-labelledby="ov-title" ref=${ref}>
      <div className="ov-head" style=${{ width: gridW + "px", maxWidth: "100%" }}>
        <h2 className="ov-title" id="ov-title">All slides</h2>
        <button type="button" className="btn" onClick=${onClose}>Close <kbd aria-hidden="true">Esc</kbd></button>
      </div>
      <ol className="ov-grid" style=${{ gridTemplateColumns: "repeat(" + cols + ", " + tw + "px)" }}>
        ${SLIDES.map((s, i) => html`<li key=${i} className=${"thumb" + (i === idx ? " cur" : "")}>
          <div className="thumb-view" style=${{ width: tw + "px", height: th + "px" }} aria-hidden="true" inert="">
            <div className="thumb-inner" style=${{ transform: "scale(" + tw / 1600 + ")" }}>
              <${ModeCtx.Provider} value=${THUMB_MODE}>
                <${Slide} slide=${s} n=${i + 1} total=${TOTAL} asThumb=${true} />
              <//>
            </div>
          </div>
          <span className="thumb-label" aria-hidden="true"><b>${i + 1}</b>${s.title}</span>
          <button type="button" className="thumb-hit" aria-label=${"Slide " + (i + 1) + ": " + s.title}
            aria-current=${i === idx ? "true" : undefined} onClick=${() => onPick(i)}></button>
        </li>`)}
      </ol>
    </div>`;
  }

  function ReadingView({ notes, setNotes, onSlides }) {
    const slidesBtn = useRef(null);
    useEffect(() => {
      if (slidesBtn.current) { try { slidesBtn.current.focus({ preventScroll: true }); } catch (e) { /* focus unavailable */ } }
    }, []);
    return html`<${ModeCtx.Provider} value=${READ_MODE}>
      <div className="reading-root reading">
        <header className="rbar">
          <span className="bar-wm">ResearchHub</span>
          <span className="bar-sub">${TOTAL} slides</span>
          <button type="button" className="btn" aria-pressed=${notes ? "true" : "false"} onClick=${() => setNotes((v) => !v)}>
            ${Icon.notes}<span>Notes</span>
          </button>
          ${onSlides ? html`<button type="button" className="btn" ref=${slidesBtn} onClick=${onSlides}>${Icon.grid}<span>Slides</span></button>` : null}
        </header>
        <main className="reading-list" aria-label="ResearchHub presentation, all slides">
          ${SLIDES.map((s, i) => html`<div className="page" key=${i}>
            <${Slide} slide=${s} n=${i + 1} total=${TOTAL} />
            ${notes ? html`<aside className="rnotes" aria-label=${"Speaker notes for slide " + (i + 1)}><p className="nt">${s.notes}</p></aside>` : null}
          </div>`)}
        </main>
      </div>
    <//>`;
  }

  function App() {
    const [idx, setIdx] = useState(hashIndex);
    const [reading, setReading] = useState(() => { const m = mql(READING_QUERY); return !!(m && m.matches); });
    const [readPref, setReadPref] = useState(false);
    const [printing, setPrinting] = useState(false);
    const [overview, setOverview] = useState(false);
    const [notes, setNotes] = useState(false);
    const [help, setHelp] = useState(false);
    const [keysOn, setKeysOn] = useState(readKeysPref);
    const [fs, setFs] = useState(false);
    const [vp, setVp] = useState({ w: window.innerWidth, h: window.innerHeight });
    const [said, setSaid] = useState("");
    const firstRun = useRef(true);
    const wasOverview = useRef(false);
    const wasPref = useRef(false);
    const gridBtn = useRef(null);
    const helpBtn = useRef(null);
    const readBtn = useRef(null);
    const touch = useRef(null);
    const readingNow = reading || readPref;
    const present = !readingNow || printing;
    const showReading = !present;

    const go = useCallback((d) => setIdx((i) => clamp(i + d)), []);
    const toggleFs = useCallback(() => {
      const d = document;
      try {
        if (d.fullscreenElement) { if (d.exitFullscreen) d.exitFullscreen(); }
        else if (d.documentElement.requestFullscreen) {
          const p = d.documentElement.requestFullscreen();
          if (p && p.catch) p.catch(() => {});
        }
      } catch (e) { /* fullscreen unavailable here */ }
    }, []);

    // Window size, reading-mode query, fullscreen and print listeners
    useEffect(() => {
      const onResize = () => setVp({ w: window.innerWidth, h: window.innerHeight });
      const onFs = () => setFs(!!document.fullscreenElement);
      const before = () => ReactDOM.flushSync(() => setPrinting(true));
      const after = () => setPrinting(false);
      window.addEventListener("resize", onResize);
      document.addEventListener("fullscreenchange", onFs);
      window.addEventListener("beforeprint", before);
      window.addEventListener("afterprint", after);
      const offRead = onMq(mql(READING_QUERY), (e) => setReading(e.matches));
      const offPrint = onMq(mql("print"), (e) => (e.matches ? before() : after()));
      return () => {
        window.removeEventListener("resize", onResize);
        document.removeEventListener("fullscreenchange", onFs);
        window.removeEventListener("beforeprint", before);
        window.removeEventListener("afterprint", after);
        offRead(); offPrint();
      };
    }, []);

    // Remember the single-letter shortcut preference
    useEffect(() => {
      try { localStorage.setItem("rh-keys", keysOn ? "on" : "off"); } catch (e) { /* storage unavailable */ }
    }, [keysOn]);

    // URL hash <-> slide, including back/forward; a bad hash is corrected in place
    useEffect(() => {
      const onHash = () => {
        const i = hashIndex();
        if (window.location.hash !== "#" + (i + 1)) {
          try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) { /* history unavailable */ }
        }
        setIdx(i);
        const el = document.querySelector(".reading-root") && document.getElementById("slide-" + (i + 1));
        if (el) el.scrollIntoView();
      };
      window.addEventListener("hashchange", onHash);
      window.addEventListener("popstate", onHash);
      return () => { window.removeEventListener("hashchange", onHash); window.removeEventListener("popstate", onHash); };
    }, []);
    useEffect(() => {
      const want = "#" + (idx + 1);
      if (window.location.hash !== want) {
        try {
          if (firstRun.current || !window.location.hash) history.replaceState(null, "", want);
          else history.pushState(null, "", want);
        } catch (e) {
          if (!firstRun.current) window.location.hash = want;
        }
      }
      if (!firstRun.current) setSaid("Slide " + (idx + 1) + " of " + TOTAL + ": " + SLIDES[idx].title);
      firstRun.current = false;
    }, [idx]);

    // Leaving the slide view closes its panels
    useEffect(() => {
      if (readingNow) { setOverview(false); setHelp(false); }
    }, [readingNow]);

    // Reading view: open at the slide named in the URL, and keep the URL on the slide being read
    useEffect(() => {
      if (!showReading) return undefined;
      const el = idx > 0 && document.getElementById("slide-" + (idx + 1));
      if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
      if (!("IntersectionObserver" in window)) return undefined;
      const io = new IntersectionObserver((entries) => entries.forEach((en) => {
        if (en.isIntersecting) {
          try { history.replaceState(null, "", "#" + en.target.id.slice(6)); } catch (e) { /* history unavailable */ }
        }
      }), { rootMargin: "-50% 0px -50% 0px" });
      document.querySelectorAll(".reading .slide[id]").forEach((s) => io.observe(s));
      return () => { io.disconnect(); setIdx(hashIndex()); };
    }, [showReading]);

    // Return focus to the grid button when the overview closes
    useEffect(() => {
      if (wasOverview.current && !overview && gridBtn.current) gridBtn.current.focus();
      wasOverview.current = overview;
    }, [overview]);

    // Return focus to the reading-view button when leaving a chosen reading view
    useEffect(() => {
      if (wasPref.current && !readPref && readBtn.current) readBtn.current.focus();
      wasPref.current = readPref;
    }, [readPref]);

    // Close the shortcuts panel on a tap or click outside it
    useEffect(() => {
      if (!help) return undefined;
      const onDown = (e) => {
        if (!(e.target.closest && e.target.closest("#help-pop, [aria-controls='help-pop']"))) setHelp(false);
      };
      document.addEventListener("pointerdown", onDown);
      return () => document.removeEventListener("pointerdown", onDown);
    }, [help]);

    // Keyboard
    useEffect(() => {
      function onKey(e) {
        if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
        const k = e.key;
        if (k === "Escape") {
          if (overview) { e.preventDefault(); setOverview(false); }
          else if (help) { e.preventDefault(); setHelp(false); if (helpBtn.current) helpBtn.current.focus(); }
          return;
        }
        if (showReading) return;
        const t = e.target;
        const onControl = !!(t && t.closest && t.closest("button, a, input, textarea, select, [contenteditable]"));
        if (!keysOn && k.length === 1 && k !== " ") return;
        if (k === "?") { e.preventDefault(); if (!overview) setHelp((v) => !v); return; }
        if (k === "o" || k === "O") { e.preventDefault(); setHelp(false); setOverview((v) => !v); return; }
        if (overview) return;
        if (k === "n" || k === "N") { e.preventDefault(); setNotes((v) => !v); return; }
        if ((k === "f" || k === "F") && CAN_FS) { e.preventDefault(); toggleFs(); return; }
        if (k === "ArrowRight" || k === "PageDown" || (k === " " && !e.shiftKey && !onControl)) { e.preventDefault(); go(1); }
        else if (k === "ArrowLeft" || k === "PageUp" || (k === " " && e.shiftKey && !onControl)) { e.preventDefault(); go(-1); }
        else if (k === "Home") { e.preventDefault(); setIdx(0); }
        else if (k === "End") { e.preventDefault(); setIdx(TOTAL - 1); }
      }
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, [overview, help, showReading, keysOn, go, toggleFs]);

    if (showReading) {
      return html`<${ReadingView} notes=${notes} setNotes=${setNotes} onSlides=${readPref ? () => setReadPref(false) : null} />`;
    }

    // Fit the 1600 x 900 stage into the window (letterboxed)
    const BAR = 56;
    const notesH = notes && !printing ? Math.round(Math.min(190, Math.max(120, vp.h * 0.24))) : 0;
    const availW = Math.max(vp.w - 32, 100);
    const availH = Math.max(vp.h - BAR - notesH - 24, 100);
    const scale = Math.min(availW / 1600, availH / 900);
    const left = Math.round((vp.w - 1600 * scale) / 2);
    const top = Math.round(12 + (availH - 900 * scale) / 2);

    const onTouchStart = (e) => {
      if (e.touches.length !== 1) { touch.current = null; return; }
      const p = e.touches[0];
      touch.current = { x: p.clientX, y: p.clientY };
    };
    const onTouchEnd = (e) => {
      const s = touch.current; touch.current = null;
      if (!s || e.touches.length) return;
      const p = e.changedTouches[0];
      const dx = p.clientX - s.x, dy = p.clientY - s.y;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) go(dx < 0 ? 1 : -1);
    };
    const blocked = overview ? "" : undefined;
    const cur = SLIDES[idx];
    const atStart = idx === 0;
    const atEnd = idx === TOTAL - 1;

    return html`<div className="deck">
      <main className="viewport" aria-label="ResearchHub presentation" inert=${blocked} aria-hidden=${overview ? "true" : undefined}
        onTouchStart=${onTouchStart} onTouchEnd=${onTouchEnd}>
        <div className="stage" style=${{ transform: "scale(" + scale + ")", left: left + "px", top: top + "px" }}>
          ${SLIDES.map((s, i) => html`<div className="page" key=${i}>
            <${Slide} slide=${s} n=${i + 1} total=${TOTAL}
              state=${i === idx ? "is-current" : i < idx ? "is-before" : "is-after"}
              hidden=${i !== idx && !printing} />
          </div>`)}
        </div>
      </main>

      ${notesH ? html`<aside className="notes" style=${{ height: notesH + "px" }} aria-label="Speaker notes" tabIndex="0" inert=${blocked}>
        <p className="nt"><span className="notes-k">Speaker notes · slide ${idx + 1} of ${TOTAL}</span>${cur.notes}</p>
      </aside>` : null}

      <footer className="bar" inert=${blocked}>
        <div className="progress" aria-hidden="true"><span style=${{ width: ((idx + 1) / TOTAL) * 100 + "%" }}></span></div>
        <div className="bar-left"><span className="bar-wm">ResearchHub</span><span className="bar-sub">Statistics pilot proposal</span></div>
        <nav className="bar-mid" aria-label="Slide navigation">
          <button type="button" className="btn" aria-label="Previous slide" title="Previous slide (←)"
            aria-disabled=${atStart ? "true" : undefined} onClick=${() => { if (!atStart) go(-1); }}>${Icon.prev}</button>
          <span className="count"><b>${idx + 1}</b> / ${TOTAL}</span>
          <button type="button" className="btn" aria-label="Next slide" title="Next slide (→)"
            aria-disabled=${atEnd ? "true" : undefined} onClick=${() => { if (!atEnd) go(1); }}>${Icon.next}</button>
        </nav>
        <div className="bar-right">
          <button type="button" className="btn" ref=${readBtn} aria-label="Reading view" title="Reading view: all slides in one scrolling page"
            onClick=${() => { setOverview(false); setHelp(false); setReadPref(true); }}>${Icon.read}<span className="lbl">Reading view</span></button>
          <button type="button" className="btn" ref=${gridBtn} aria-label="All slides" aria-haspopup="dialog" aria-expanded=${overview ? "true" : "false"}
            title="All slides (O)" onClick=${() => { setHelp(false); setOverview((v) => !v); }}>${Icon.grid}<span className="lbl">Slides</span></button>
          <button type="button" className="btn" aria-label="Speaker notes" aria-pressed=${notes ? "true" : "false"}
            title="Speaker notes (N)" onClick=${() => setNotes((v) => !v)}>${Icon.notes}<span className="lbl">Notes</span></button>
          ${CAN_FS ? html`<button type="button" className="btn" aria-label="Full screen" aria-pressed=${fs ? "true" : "false"}
            title="Full screen (F)" onClick=${toggleFs}>${fs ? Icon.exit : Icon.full}<span className="lbl">Full screen</span></button>` : null}
          <button type="button" className="btn" ref=${helpBtn} aria-label="Keyboard shortcuts" aria-expanded=${help ? "true" : "false"}
            aria-controls=${help ? "help-pop" : undefined} title="Keyboard shortcuts (?)" onClick=${() => setHelp((v) => !v)}><span aria-hidden="true">?</span></button>
        </div>
      </footer>

      ${help && !overview ? html`<${Help} keysOn=${keysOn} setKeysOn=${setKeysOn} />` : null}
      ${overview ? html`<${Overview} idx=${idx} vw=${vp.w} onClose=${() => setOverview(false)}
          onPick=${(i) => { setIdx(i); setOverview(false); }} />` : null}
      <div className="sr-only" aria-live="polite" aria-atomic="true">${said}</div>
    </div>`;
  }

  // Show a message instead of a blank page if a slide fails to render
  class Boundary extends React.Component {
    constructor(props) { super(props); this.state = { err: null }; }
    static getDerivedStateFromError(err) { return { err }; }
    render() {
      return this.state.err
        ? html`<div className="offline" role="alert"><p className="offline-title">ResearchHub</p><p>The presentation hit an error and stopped. Reload the page.</p></div>`
        : this.props.children;
    }
  }

  ReactDOM.createRoot(mount).render(html`<${Boundary}><${App} /><//>`);
})();
</script>
</body>
</html>
