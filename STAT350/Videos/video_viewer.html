nch: Collection Methods and Data Formats","description":"Introduces the first branch of statistics — dealing with data — surveying collection methods (surveys, experiments, web scraping, sensors, documents) and structured versus unstructured data formats.","key_concepts":[],"difficulty":null},{"start_s":238.882,"end_s":339.77,"segment_type":"concept_explanation","title":"Planning a Study and Data Quality Assurance","description":"Explains that data is always collected for a purpose, so studies must be planned in advance, problems anticipated, processes continuously reviewed, and the resulting data quality-assured.","key_concepts":[],"difficulty":null},{"start_s":339.77,"end_s":375.554,"segment_type":"concept_explanation","title":"Ethics in Data Collection","description":"Covers the ethical obligations of data collection: informed consent, privacy and confidentiality of subjects, and compliance with laws such as FERPA, HIPAA, and the EU's data regulation.","key_concepts":[],"difficulty":null},{"start_s":375.554,"end_s":492.313,"segment_type":"real_world_application","title":"The Scale of Modern Data Sources","description":"Illustrates today's enormous data volumes with real examples — X/Twitter tweets, Facebook's petabytes, GPS and health-device data, projected exabytes — and notes this course uses only simple structured data.","key_concepts":[],"difficulty":null},{"start_s":492.313,"end_s":654.105,"segment_type":"concept_explanation","title":"Data Cleaning: Missing Values, Errors, and Documentation","description":"Details making data usable: handling missing values by deletion, imputation, or flagging; correcting erroneous and duplicate entries; consolidating sources; and documenting every cleaning step.","key_concepts":[],"difficulty":null},{"start_s":654.105,"end_s":695.918,"segment_type":"concept_explanation","title":"Data Storage Options by Size and Sensitivity","description":"Matches storage solutions to the data at hand, from simple Excel spreadsheets to relational databases, data warehouses, lakes, and cloud storage, with security and privacy considerations.","key_concepts":[],"difficulty":null},{"start_s":695.918,"end_s":788.168,"segment_type":"concept_explanation","title":"Descriptive Statistics and Exploratory Data Analysis","description":"Defines descriptive statistics/EDA as graphical and numerical methods for organizing, summarizing, and communicating a dataset's tendencies, spread, and relationships to stakeholders.","key_concepts":[],"difficulty":null},{"start_s":788.168,"end_s":935.541,"segment_type":"concept_explanation","title":"Inferential Statistics: From Sample to Population","description":"Explains statistical inference as using a sample to draw conclusions about a population — point estimation of parameters, quantifying uncertainty, checking model assumptions, and hypothesis testing.","key_concepts":[],"difficulty":null},{"start_s":935.541,"end_s":981.777,"segment_type":"concept_explanation","title":"Predictive Analytics and Making Predictions","description":"Introduces predictive analytics as making guesses about future or unobserved values, previewing the linear regression the course will use to relate two quantitative variables.","key_concepts":[],"difficulty":null},{"start_s":981.777,"end_s":1011.807,"segment_type":"summary","title":"Course Roadmap: Data, Probability, Design, Inference","description":"Maps the branches just discussed onto the semester's sequence: working with and describing data, then probability, experimental design, and finally inferential statistics.","key_concepts":[],"difficulty":null},{"start_s":1011.807,"end_s":1123.557,"segment_type":"real_world_application","title":"What Is a Statistician and Where Do They Work?","description":"Defines a statistician per the ASA as someone applying statistical thinking across scientific, social, and business fields, and contrasts their guidance role with those who misuse statistics.","key_concepts":[],"difficulty":null},{"start_s":1123.557,"end_s":1197.327,"segment_type":"concept_explanation","title":"Statistical Literacy: The Baseline Course Goal","description":"Describes the course's minimum outcome — statistical literacy: knowing the vocabulary and symbols, basic data exploration and presentation, basic probability, and when methods are valid.","key_concepts":[],"difficulty":null},{"start_s":1197.327,"end_s":1245.187,"segment_type":"concept_explanation","title":"Statistical Reasoning: One Step Above Literacy","description":"Defines statistical reasoning as adding the ability to interpret and summarize data, communicate it to stakeholders, and perform simple statistical inference.","key_concepts":[],"difficulty":null},{"start_s":1245.187,"end_s":1323.331,"segment_type":"concept_explanation","title":"Statistical Thinking: The Ultimate Goal","description":"Presents the highest skill level — understanding sampling, experimental design, models, and the full data-to-inference pipeline — framed by the famous quote on statistical thinking and citizenship.","key_concepts":[],"difficulty":null},{"start_s":1323.331,"end_s":1353.1,"segment_type":"summary","title":"Closing: Where You Should Be by Semester's End","description":"Recaps that students should reach at least the middle of statistical reasoning, and hopefully approach statistical thinking, since this course is only a first step.","key_concepts":[],"difficulty":null}]},{"id":"lec-5203b0213f88","order":3,"title":"Intro to R","chapter":null,"video_provider":"youtube","video_id":"olkU2T4d8PI","duration_s":1833.798633,"segments":[{"start_s":1.04,"end_s":46.904,"segment_type":"introduction","title":"Course Computer Assignments and What This Video Covers","description":"Introduces the semester's computer assignments in R and previews the video: how R differs from general-purpose languages and how to get started.","key_concepts":[],"difficulty":null},{"start_s":46.904,"end_s":155.584,"segment_type":"concept_explanation","title":"What R Is: Origins in the S Language and Open-Source History","description":"Defines R as a statistical programming language and traces its lineage from Bell Labs' S in the 1970s to the open-source R created at the University of Auckland.","key_concepts":[],"difficulty":null},{"start_s":155.584,"end_s":298.696,"segment_type":"concept_explanation","title":"Why R Instead of Python or C++: Packages, Graphics, and Portability","description":"Explains R's advantages — rich statistical packages, ggplot visualization, data manipulation tools, open source, cross-platform, and interoperability — while advising students to also learn Python and SAS.","key_concepts":[],"difficulty":null},{"start_s":298.696,"end_s":352.874,"segment_type":"concept_explanation","title":"R's Package Ecosystem and the install.packages() Command","description":"Describes the community-built domain-specific package ecosystem and shows that install.packages() handles installation of any package by name.","key_concepts":[],"difficulty":null},{"start_s":352.874,"end_s":390.803,"segment_type":"concept_explanation","title":"RStudio: The IDE Used for the Course","description":"Introduces the RStudio IDE developed by Posit as the supported interface for the course, noting Jupyter as an alternative and pointing to install links on Brightspace.","key_concepts":[],"difficulty":null},{"start_s":390.803,"end_s":469.644,"segment_type":"concept_explanation","title":"Where to Run R: The Scholar Cluster vs. Your Own Machine","description":"Presents Purdue's Scholar computing cluster with its GUI gateway at rcac.purdue.edu, but strongly recommends also installing R and RStudio locally as a backup near assignment deadlines.","key_concepts":[],"difficulty":null},{"start_s":469.644,"end_s":562.484,"segment_type":"example","title":"Launching RStudio Server on Scholar: Version, Walltime, and Cores","description":"Walks through the launch steps — boiler key login, Interactive Apps, RStudio Server, version 4.2.2, 4-hour walltime, one core — and waiting in the queue until Connect to RStudio appears.","key_concepts":[],"difficulty":null},{"start_s":562.484,"end_s":603.074,"segment_type":"common_mistakes","title":"Saturday Night Reboots and Freeing Your Compute Node","description":"Warns that the RStudio server reboots every Saturday around midnight, so save work beforehand, and to exit RStudio properly and delete unused compute nodes to free resources.","key_concepts":[],"difficulty":null},{"start_s":603.074,"end_s":718.384,"segment_type":"practice_problem","title":"Computer Assignment 1: Exploring and Cleaning the German Credit Dataset","description":"Describes the first computer assignment — loading the semester's dataset (German Credit, 23 variables in spring 2024), exploring it, handling missing values, saving the cleaned data, and doing basic transformations.","key_concepts":[],"difficulty":null},{"start_s":718.384,"end_s":807.017,"segment_type":"concept_explanation","title":"Key Commands: View, is.na, help, and complete.cases","description":"Explains the core exploration and cleaning commands — View for tabular inspection, is.na for cell-level missing values, help for documentation, and complete.cases for finding rows with missing observations.","key_concepts":[],"difficulty":null},{"start_s":807.017,"end_s":884.074,"segment_type":"concept_explanation","title":"Log Transformations and Accessing Variables with the $ Operator","description":"Covers applying log transformations (defaulting to log base e) to data and using the dollar-sign syntax to access a specific variable within a dataset.","key_concepts":[],"difficulty":null},{"start_s":884.074,"end_s":981.337,"segment_type":"example","title":"Demo: Finding Computer Assignment Materials on Brightspace","description":"Live tour of the Brightspace Computer Assignments module showing the Scholar link, Windows and Mac install folders, and where the CSV data files are downloaded.","key_concepts":[],"difficulty":null},{"start_s":981.337,"end_s":1083.507,"segment_type":"example","title":"Demo: Edfinity Assignments, Instructions, and Tutorials","description":"Shows how assignments are submitted through Edfinity, where the assignment instructions live, and how to reach the step-by-step tutorials from both Edfinity and Brightspace.","key_concepts":[],"difficulty":null},{"start_s":1083.507,"end_s":1152.947,"segment_type":"example","title":"Live Demo: Starting an RStudio Server Session on Scholar","description":"Demonstrates the actual launch on Scholar — selecting RStudio Server version 4.2.2 (to match tutorial syntax), 4-hour walltime, one core — and connecting once a compute node is granted.","key_concepts":[],"difficulty":null},{"start_s":1152.947,"end_s":1227.867,"segment_type":"example","title":"Tour of the RStudio Interface: Console, Help, and Plots Panes","description":"Tours the RStudio layout, running interactive commands and help(is.na) in the console and showing the bottom-right pane for help output, plots, packages, and file exploration.","key_concepts":[],"difficulty":null},{"start_s":1227.867,"end_s":1295.227,"segment_type":"concept_explanation","title":"Environment Variables and the Arrow (<-) Assignment Operator","description":"Shows the environment pane where created variables appear and explains R's arrow assignment operator, noting = also works but <- is standard R notation.","key_concepts":[],"difficulty":null},{"start_s":1295.227,"end_s":1383.365,"segment_type":"example","title":"Navigating to the Course Data in the depot/statclass Folder","description":"Navigates (with a live path mix-up) to the shared depot/statclass/data/stat35000 folder on Scholar to locate the semester's CreditDataSpring dataset.","key_concepts":[],"difficulty":null},{"start_s":1383.365,"end_s":1531.98,"segment_type":"example","title":"Import Dialog Settings: Headings, Separators, Quotes, and NA Values","description":"Steps through the CSV import dialog, explaining each option — headings as variable names, comma separator, period decimals, double-quote strings, comments, and NA for missing values.","key_concepts":[],"difficulty":null},{"start_s":1531.98,"end_s":1589.094,"segment_type":"example","title":"Importing the Dataset and Inspecting It with View","description":"Completes the import, showing the auto-generated read.csv and View commands, the new environment variable with 1000 observations of 24 variables, and the tabular data view.","key_concepts":[],"difficulty":null},{"start_s":1589.094,"end_s":1686.306,"segment_type":"example","title":"Put Your Code in an R Script, Not the Console","description":"Advises keeping the data-loading command at the top of an R script rather than typing in the console, demonstrating by clearing the environment and rerunning the saved commands to restore the dataset.","key_concepts":[],"difficulty":null},{"start_s":1686.306,"end_s":1743.814,"segment_type":"example","title":"Spotting Missing Values and Working Alongside the Tutorials","description":"Spots missing values in the foreignWorker variable as motivation for cleaning, and advises working through the tutorial's example dataset before tackling the graded assignment data.","key_concepts":[],"difficulty":null},{"start_s":1743.814,"end_s":1807.364,"segment_type":"example","title":"Ending Your Session: Quit RStudio and Delete the Compute Node","description":"Demonstrates closing out properly — quitting RStudio (choosing whether to save the workspace), then deleting the interactive session node to free it for other students.","key_concepts":[],"difficulty":null},{"start_s":1807.364,"end_s":1831.7,"segment_type":"summary","title":"Wrap-Up: Practice with the Tutorials","description":"Brief closing recap encouraging students to work through the tutorials, reassuring them the assignments get easier with familiarity.","key_concepts":[],"difficulty":null}]},{"id":"lec-392580c680b8","order":4,"title":"Chapter 1.2 Probability Population to Sample - Inference Sample to Population","chapter":"1.2","video_provider":"youtube","video_id":"PE0EBtI4ffk","duration_s":546.479267,"segments":[{"start_s":0.64,"end_s":58.004,"segment_type":"introduction","title":"Two Halves of the Course: Probability vs. Statistical Inference","description":"Frames the course as two directions of reasoning — probability goes from a known population model to the chances of a sample, while statistical inference goes from an observed sample back to unknown population characteristics.","key_concepts":[],"difficulty":null},{"start_s":58.004,"end_s":139.514,"segment_type":"concept_explanation","title":"The Probability Direction: Population, Model, and Sample Defined","description":"Defines the core vocabulary of the probability workflow — the population as the entire collection under study, the probabilistic model that condenses its behavior, and the sample as a subset whose chances the model lets us compute.","key_concepts":[],"difficulty":null},{"start_s":139.514,"end_s":179.044,"segment_type":"concept_explanation","title":"What Is a Parameter? The 36% Passport Rate","description":"Uses the State Department report that 36% of all Americans hold a passport to define a parameter as a known attribute describing the population.","key_concepts":[],"difficulty":null},{"start_s":179.044,"end_s":272.244,"segment_type":"example","title":"Worked Probability Question: Chance 10 of 20 Sampled Americans Have Passports","description":"Walks through a forward probability problem — given the known 36% parameter and a random sample of n = 20, counting the ways 10 people could hold passports under independence yields roughly an 8% chance.","key_concepts":[],"difficulty":null},{"start_s":272.244,"end_s":371.154,"segment_type":"concept_explanation","title":"The Inference Direction: From Sample Back to an Unknown Population","description":"Explains statistical inference as starting from a sample when the population and its parameters are unknown, using minimal assumptions and the language of probability to estimate population characteristics — the focus of about 80% of the course.","key_concepts":[],"difficulty":null},{"start_s":371.154,"end_s":497.784,"segment_type":"example","title":"Worked Inference Example: Estimating the Passport Rate from 8 of 20","description":"Reverses the passport scenario — observing 8 of 20 sampled Americans with passports gives a best-guess estimate of 40%, which must be wrapped in error bounds that quantify uncertainty, provided the sampling assumptions hold.","key_concepts":[],"difficulty":null},{"start_s":497.784,"end_s":544.2,"segment_type":"summary","title":"Recap: Ask Which Direction You're Reasoning In","description":"Closes by urging students to always ask whether a problem starts from a known population to compute probabilities or from a sample alone to infer about the population.","key_concepts":[],"difficulty":null}]},{"id":"lec-2aa81e50e3ea","order":5,"title":"Chapter 2.1 Tables and Graphs for Summarizing Data - Structured Data Sets","chapter":"2.1","video_provider":"youtube","video_id":"SKYjEnzY75I","duration_s":1156.522033,"segments":[{"start_s":0.84,"end_s":46.958,"segment_type":"introduction","title":"Why We Study Data Storage and Visualization: Structured vs. Unstructured Data","description":"Motivates the chapter and scopes the course to structured, tabular data rather than unstructured text, video, image, or GPS data.","key_concepts":[],"difficulty":null},{"start_s":46.958,"end_s":168.093,"segment_type":"example","title":"The Trees Dataset: Rows as Cases, Columns as Variables","description":"Uses the 30-observation felled black cherry trees dataset to show how tabular data organizes cases (rows) and variables (columns) and how to read a single observation's diameter, height, and volume.","key_concepts":[],"difficulty":null},{"start_s":168.093,"end_s":216.99,"segment_type":"concept_explanation","title":"Qualitative (Categorical) Variables Defined","description":"Defines categorical variables as classifications into distinct categories that cannot be measured, weighed, or compared on a numerical scale.","key_concepts":[],"difficulty":null},{"start_s":216.99,"end_s":305.085,"segment_type":"concept_explanation","title":"Nominal Variables: Unordered Categories (Fruits, Car Brands, Colors)","description":"Introduces the nominal level of measurement — pure, unorderable categories — illustrated with fruit types, car brands, and discrete color labels.","key_concepts":[],"difficulty":null},{"start_s":305.085,"end_s":369.368,"segment_type":"concept_explanation","title":"Ordinal Variables: Categories with Inherent Order","description":"Explains ordinal variables as ranked categories with no measurable distance between them, using education levels and survey agreement scales as examples.","key_concepts":[],"difficulty":null},{"start_s":369.368,"end_s":409.376,"segment_type":"summary","title":"Recap: Nominal vs. Ordinal Categorical Variables","description":"Briefly restates the categorical variable family — nominal versus ordinal — and notes that each admits different graphical methods to be covered later.","key_concepts":[],"difficulty":null},{"start_s":409.376,"end_s":440.412,"segment_type":"concept_explanation","title":"Quantitative (Numerical) Variables Defined","description":"Introduces quantitative variables as measurements on a numerical scale that permit arithmetic operations beyond mere categorization.","key_concepts":[],"difficulty":null},{"start_s":440.412,"end_s":504.746,"segment_type":"concept_explanation","title":"Discrete Variables: Countable Values","description":"Defines discrete variables as having countably many values with jumps between them, exemplified by counts of books, meeting attendees, and sides of shapes.","key_concepts":[],"difficulty":null},{"start_s":504.746,"end_s":591.118,"segment_type":"concept_explanation","title":"Continuous Variables: Infinitely Many Values Between Any Two Points","description":"Explains continuous variables whose precision depends on the measuring tool, contrasting height and room temperature with the enumerable values of discrete variables.","key_concepts":[],"difficulty":null},{"start_s":591.118,"end_s":658.971,"segment_type":"concept_explanation","title":"Interval Measurements: Meaningful Differences, No True Zero","description":"Introduces the interval level of measurement, where order and exact differences are meaningful and addition/subtraction apply, but the lack of a true zero rules out multiplication and division.","key_concepts":[],"difficulty":null},{"start_s":658.971,"end_s":762.566,"segment_type":"common_mistakes","title":"Why 'Twice as Hot' Fails: Celsius/Fahrenheit vs. Kelvin","description":"Warns that multiplying interval-scale values like Fahrenheit temperatures has no physical meaning without an absolute zero, while showing that distance comparisons between interval measurements remain valid.","key_concepts":[],"difficulty":null},{"start_s":762.566,"end_s":846.267,"segment_type":"concept_explanation","title":"Ratio Variables: True Zero and Full Arithmetic","description":"Defines ratio variables as interval measurements with a meaningful zero point, enabling multiplication and division for quantities like height, weight, duration, and counts.","key_concepts":[],"difficulty":null},{"start_s":846.267,"end_s":953.131,"segment_type":"concept_explanation","title":"Classify by the Highest Possible Level: The Income Example","description":"Argues that variables should be classified by their conceptually highest attainable measurement level, even when the reported data — like income collapsed into brackets — has been discretized downward.","key_concepts":[],"difficulty":null},{"start_s":953.131,"end_s":1116.342,"segment_type":"real_world_application","title":"First Questions to Ask About a New Dataset","description":"Walks through the practical checklist for encountering an unfamiliar dataset: who or what the cases are, completeness and missing values, variable definitions and units, and the original purpose of the data's collection.","key_concepts":[],"difficulty":null},{"start_s":1116.342,"end_s":1154.4,"segment_type":"summary","title":"Recap and Preview: From Data Questions to Visualization","description":"Recaps the tabular-data workflow — variables, observations, and pre-analysis questions — and previews the next topic of properly visualizing each variable.","key_concepts":[],"difficulty":null}]},{"id":"lec-82e418071cc2","order":6,"title":"Chapter 2.2 Graphical Summaries- Categorical-Qualitative Tools_1","chapter":"2.2","video_provider":"youtube","video_id":"g8A7vIt8L9o","duration_s":1327.959967,"segments":[{"start_s":0.763,"end_s":80.951,"segment_type":"introduction","title":"From Data Exploration to Visualization","description":"Recaps the prior data-exploration workflow (observations, variables, missing values, levels of measurement) and introduces visualization as the next step, with separate toolsets for categorical versus quantitative variables.","key_concepts":[],"difficulty":null},{"start_s":80.951,"end_s":160.491,"segment_type":"concept_explanation","title":"What You Can Do With Categorical Data: Counting","description":"Explains that categorical data has no inherent measurement or distance, so the only real summary available is counting how many observations fall within each category.","key_concepts":[],"difficulty":null},{"start_s":160.491,"end_s":206.286,"segment_type":"concept_explanation","title":"Frequency, Relative Frequency, and Percent Frequency","description":"Defines the three ways to report category counts: raw frequency, relative frequency (proportion), and percent frequency.","key_concepts":[],"difficulty":null},{"start_s":206.286,"end_s":253.128,"segment_type":"concept_explanation","title":"Pie Charts: Categories as Parts of a Whole","description":"Defines the pie chart as a display that partitions non-overlapping categories into slices of a circle representing portions of a whole.","key_concepts":[],"difficulty":null},{"start_s":253.128,"end_s":344.84,"segment_type":"real_world_application","title":"The UC Berkeley Admissions Dataset in R","description":"Introduces the real 1973 UCB admissions dataset (about 4,500 applicants to six departments, with department, admission outcome, and sex) and shows how to load and get help on it in base R.","key_concepts":[],"difficulty":null},{"start_s":344.84,"end_s":414.916,"segment_type":"example","title":"Admissions by Sex Pie Charts: An Apparent Bias","description":"Reads paired pie charts showing 44.5% of male versus 30.4% of female applicants admitted, which at face value suggests sexist admissions.","key_concepts":[],"difficulty":null},{"start_s":414.916,"end_s":540.71,"segment_type":"example","title":"Applicants, Admissions, and Rejections by Department","description":"Breaks the data down with pie charts of applicants, admissions, and rejections across the six departments, noting departments A-D accepted proportionally more while E and F rejected heavily.","key_concepts":[],"difficulty":null},{"start_s":540.71,"end_s":645.258,"segment_type":"example","title":"Breaking Down by Sex: Who Applies Where","description":"Plots applicants, admissions, and rejections by sex and then applications by department and sex, revealing that males dominated applications to departments A and B, which also had the most acceptances.","key_concepts":[],"difficulty":null},{"start_s":645.258,"end_s":849.976,"segment_type":"deep_reasoning","title":"Department-by-Sex Breakdown Resolves the Bias (Simpson's Paradox)","description":"Combines department, sex, and admission outcome in one display to reason that females applied mostly to the more restrictive departments, so the apparent sex bias is explained by department choice rather than discriminatory admissions.","key_concepts":[],"difficulty":null},{"start_s":849.976,"end_s":896.594,"segment_type":"concept_explanation","title":"Bar Graphs: When Categories Can Overlap","description":"Defines bar graphs as rectangles whose heights show counts, percentages, or proportions, and explains they are needed when units can belong to multiple categories so a pie chart's whole would exceed 100%.","key_concepts":[],"difficulty":null},{"start_s":896.594,"end_s":980.541,"segment_type":"example","title":"Club Membership Bar Graph with Overlapping Categories","description":"Works through simulated club-membership data for 450 students across ten clubs where students belong to multiple clubs, making a bar graph appropriate and a pie chart invalid.","key_concepts":[],"difficulty":null},{"start_s":980.541,"end_s":1127.687,"segment_type":"example","title":"Bar Graphs for Many Categories: US Arrests by State","description":"Uses the USArrests dataset (arrests per 100,000 residents by state in 1973) to show that bar graphs stay readable with many categories where a pie chart would become an unreadable sliver display.","key_concepts":[],"difficulty":null},{"start_s":1127.687,"end_s":1298.994,"segment_type":"example","title":"Hair and Eye Color: Combining and Grouping Categories","description":"Explores the 1974 University of Delaware hair/eye color survey with bar graphs of combined hair-eye categories and grouped views that condition eye color within each hair color.","key_concepts":[],"difficulty":null},{"start_s":1298.994,"end_s":1326.6,"segment_type":"summary","title":"Recap and Transition to Numerical Tools","description":"Recaps bar graphs and pie charts of counts, proportions, and percentages as the categorical toolkit and previews the more detailed numerical tools discussed next.","key_concepts":[],"difficulty":null}]},{"id":"lec-2e40a741d187","order":7,"title":"Chapter 2.3 Graphical Summaries- Numerical-Quantitative Tools","chapter":"2.3","video_provider":"youtube","video_id":"EiVdnnZtcRI","duration_s":1707.972933,"segments":[{"start_s":0.635,"end_s":89.544,"segment_type":"introduction","title":"Why Numerical Data Needs More Than Pie Charts: Center, Spread, and Shape","description":"Motivates the chapter by explaining that quantitative variables carry distance information, letting us quantify central tendency, spread, and shape beyond what categorical tools show.","key_concepts":[],"difficulty":null},{"start_s":89.544,"end_s":185.9,"segment_type":"concept_explanation","title":"What a Histogram Is: Binning the Number Line","description":"Defines a histogram as a display of a quantitative variable's distribution built by segmenting the number line into non-overlapping intervals and using bar heights for frequencies.","key_concepts":[],"difficulty":null},{"start_s":185.9,"end_s":308.345,"segment_type":"concept_explanation","title":"Discrete Variables: Bar Graph or Histogram?","description":"Explains that few unique discrete values call for a bar graph while many unique values call for a histogram, and introduces the terms class, class interval, and bin.","key_concepts":[],"difficulty":null},{"start_s":308.345,"end_s":524.694,"segment_type":"example","title":"Insecticide Data: From Cumbersome Bar Graph to Discrete Histogram","description":"Works through the 72-observation insect spray dataset, showing how a bar graph of counts 0-26 is cumbersome and how binning into a histogram reveals center, shape, and spread.","key_concepts":[],"difficulty":null},{"start_s":524.694,"end_s":598.134,"segment_type":"example","title":"Comparing Insect Sprays with a Bar Graph","description":"Uses a bar graph of total insects found per insecticide (A through F) to identify sprays C, D, and E as apparently most effective.","key_concepts":[],"difficulty":null},{"start_s":598.134,"end_s":718.704,"segment_type":"example","title":"Histograms Partitioned by Insecticide Type","description":"Demonstrates plotting a separate insect-count histogram for each spray on aligned axes, combining a categorical variable with a quantitative one to compare distributions.","key_concepts":[],"difficulty":null},{"start_s":718.704,"end_s":793.034,"segment_type":"summary","title":"Recap: Choosing Bar Graph vs Histogram for Discrete Data","description":"Restates the decision rule that a small set of distinct integer values warrants a bar graph while many unique values warrant a histogram that groups data into ranges.","key_concepts":[],"difficulty":null},{"start_s":793.034,"end_s":1013.009,"segment_type":"example","title":"Children per Couple: Building a Bar Graph from a Frequency Table","description":"Constructs a discrete bar graph from a table of 100 couples' child counts, converts to relative frequencies, and reads off the center near 2-3 kids, the outlier at 7, and the right-tailing shape.","key_concepts":[],"difficulty":null},{"start_s":1013.009,"end_s":1093.137,"segment_type":"concept_explanation","title":"Continuous Variables Must Be Discretized into Bins","description":"Explains why continuous data, which has essentially no duplicate values, cannot use a bar graph and must first be chopped into equal-size non-overlapping intervals.","key_concepts":[],"difficulty":null},{"start_s":1093.137,"end_s":1254.409,"segment_type":"concept_explanation","title":"Rule of Thumb for Choosing the Number of Bins","description":"Presents the bin-count rule max(5, round(sqrt(n)) + 2) for datasets of 400 or fewer observations and exploring 20-30 bins for larger data.","key_concepts":[],"difficulty":null},{"start_s":1254.409,"end_s":1358.052,"segment_type":"real_world_application","title":"Furnace Dataset: Home Energy Consumption and Degree Days","description":"Introduces the Wisconsin Power and Light dataset of 90 gas-heated homes, explaining BTU consumption and the adjusted consumption ratio based on weather degree days and house area.","key_concepts":[],"difficulty":null},{"start_s":1358.052,"end_s":1463.364,"segment_type":"example","title":"Furnace Histogram with Normal and Kernel Density Curves","description":"Plots the furnace data histogram and explains the two superimposed curves — the blue normal distribution curve and the red smooth kernel curve — that students must always include.","key_concepts":[],"difficulty":null},{"start_s":1463.364,"end_s":1632.284,"segment_type":"common_mistakes","title":"Too Few or Too Many Bins: Oversmoothing vs Jaggedness","description":"Compares the furnace histogram with 6, 10, 15, and 30 bins to show how too few bins oversmooth away detail while too many produce jagged, overly data-sensitive plots.","key_concepts":[],"difficulty":null},{"start_s":1632.284,"end_s":1706.5,"segment_type":"example","title":"Applying the Bin Rule in R to the Furnace Data","description":"Applies the square-root rule of thumb in R to pick the furnace bin count, confirming it lands between the extremes, and previews the next topic of modality, shape, and outliers.","key_concepts":[],"difficulty":null}]},{"id":"lec-9988f96fbf5b","order":8,"title":"Chapter 2.4 Exploring Quantitative Distributions- Modality, Shape and Outliers","chapter":"2.4","video_provider":"youtube","video_id":"XwtyBLVThPY","duration_s":1355.687667,"segments":[{"start_s":0.84,"end_s":80.494,"segment_type":"introduction","title":"Reading Histograms for Overall Pattern: Shape, Center, and Spread","description":"Introduces the goal of the section: using a histogram to describe a quantitative variable's overall pattern — its shape, central locations, symmetry, and spread — and to watch for deviations from that pattern.","key_concepts":[],"difficulty":null},{"start_s":80.494,"end_s":148.604,"segment_type":"concept_explanation","title":"Outliers as Deviations: Why They Must Be Investigated","description":"Defines outliers as points far from the overall pattern and explains why each must be inspected — they may be erroneous entries or genuine features, and real outliers can violate assumptions of later statistical inference.","key_concepts":[],"difficulty":null},{"start_s":148.604,"end_s":235.184,"segment_type":"concept_explanation","title":"Modality: Unimodal, Bimodal, and Multimodal Distributions","description":"Explains modality as the number of peaks in a distribution, covering unimodal (single population), bimodal (two groups possibly split by a lurking categorical variable), and multimodal shapes.","key_concepts":[],"difficulty":null},{"start_s":235.184,"end_s":279.344,"segment_type":"common_mistakes","title":"Pitfall: Too-Fine Bin Sizes Create Fake Modes","description":"Warns that an overly fine histogram bin size can make spurious extra modes appear, so bin size must be tuned before concluding the data is anything other than the typical unimodal or bimodal case.","key_concepts":[],"difficulty":null},{"start_s":279.344,"end_s":413.274,"segment_type":"concept_explanation","title":"Skewness and Symmetry: Left-Skewed, Right-Skewed, and Symmetric Shapes","description":"Defines skewness by the direction of the tail — negatively/left skewed, positively/right skewed, or symmetric — and notes that symmetric data is preferred for later inference procedures based on the normal distribution.","key_concepts":[],"difficulty":null},{"start_s":413.274,"end_s":544.968,"segment_type":"concept_explanation","title":"Spotting Outliers in Histograms: Plotting Range and Gaps","description":"Shows how R's automatic plotting range and gaps of empty bins in a histogram flag possible outliers, walking through a plot where three far-away points are identified for further exploration.","key_concepts":[],"difficulty":null},{"start_s":544.968,"end_s":707.468,"segment_type":"example","title":"Old Faithful Data: Interpreting Bimodal Waiting and Eruption Times","description":"Works through histograms of the Old Faithful geyser data, showing that both waiting time and eruption length are bimodal and that the kernel density curve captures the two peaks while the fitted normal curve does not.","key_concepts":[],"difficulty":null},{"start_s":707.468,"end_s":873.698,"segment_type":"example","title":"Black Cherry Trees Data: Judging Skewness in Small Samples","description":"Assesses histograms of height, diameter, and volume for 31 black cherry trees, concluding roughly symmetric-to-negatively-skewed height and positively skewed diameter and volume, while cautioning that only 31 observations makes shape hard to judge.","key_concepts":[],"difficulty":null},{"start_s":873.698,"end_s":979.93,"segment_type":"concept_explanation","title":"Introducing ggplot and the Grammar of Graphics","description":"Introduces the ggplot package as the course's plotting tool, explaining its grammar-of-graphics philosophy of adding components together and its origins, including Purdue's William Cleveland.","key_concepts":[],"difficulty":null},{"start_s":979.93,"end_s":1057.918,"segment_type":"concept_explanation","title":"ggplot Basics: Loading ggplot2, the Plotting Frame, and Aesthetics (aes)","description":"Covers the core ggplot workflow — loading ggplot2 with library(), calling ggplot() with a data frame, and using the aes() aesthetics function to map variables to the x-axis, y-axis, and other plot components.","key_concepts":[],"difficulty":null},{"start_s":1057.918,"end_s":1135.019,"segment_type":"concept_explanation","title":"ggplot Layers: geoms and Building Plots with the + Operator","description":"Explains layers as the graph types — geom_bar, geom_histogram, geom_density, geom_boxplot — and how components are pieced together with the + symbol to construct the final plot.","key_concepts":[],"difficulty":null},{"start_s":1135.019,"end_s":1233.333,"segment_type":"concept_explanation","title":"Saving and Customizing ggplot: ggsave, stat, Scales, Themes, and the Cheat Sheet","description":"Surveys auxiliary ggplot components — ggsave for saving, stat for on-the-fly computations, scales for axis control, and themes for titles, labels, and fonts — and points students to the provided cheat sheet of geoms.","key_concepts":[],"difficulty":null},{"start_s":1233.333,"end_s":1352.9,"segment_type":"example","title":"Code Walkthrough: UCBAdmissions Pie Chart in ggplot","description":"Walks through the provided R code for the UCBAdmissions data set, showing how data() loads it and how ggplot with aes(y = frequency, fill = Dept), geom_bar, and coord_polar produce the pie chart, with the rest left for students to explore.","key_concepts":[],"difficulty":null}]},{"id":"lec-6363ccfeb772","order":9,"title":"Chapter 3.1 Intro Numerical Summary Measures","chapter":"3.1","video_provider":"youtube","video_id":"SR-68DQX4Gs","duration_s":565.798567,"segments":[{"start_s":0.69,"end_s":76.045,"segment_type":"introduction","title":"Lecture Roadmap: Numerical Summaries, Box Plots, and Standard Units","description":"Previews the chapter's agenda: condensing data into single numerical measures of center and variability, combining them visually in a box plot, and converting data to unitless standard units for comparison.","key_concepts":[],"difficulty":null},{"start_s":76.045,"end_s":172.5,"segment_type":"concept_explanation","title":"Notation Basics: Variables x, y, z, Sample Size n, and Subscripts","description":"Introduces standard statistical notation — lowercase letters for variables, n for the sample size, and subscripts x1 through xn for referencing individual observations.","key_concepts":[],"difficulty":null},{"start_s":172.5,"end_s":242.682,"segment_type":"example","title":"Worked Example: Subscript Notation on a Five-Value Data Set","description":"Applies subscript notation to a concrete five-observation list (301, 202, 101, 125, 131), mapping x1 through x5 to the stored values with n = 5.","key_concepts":[],"difficulty":null},{"start_s":242.682,"end_s":307.9,"segment_type":"concept_explanation","title":"Double Subscript Notation for Multiple Groups","description":"Extends the notation to double subscripts for one variable measured across several groups, where the first index identifies the group and the second the observation within it.","key_concepts":[],"difficulty":null},{"start_s":307.9,"end_s":395.98,"segment_type":"example","title":"Example: Indexing Weight Samples from Four Groups","description":"Illustrates double subscripts by sampling weights from four populations with sizes n1 = 32, n2 = 25, n3 = 15, and n4 = 50, noting this indexing returns later for ANOVA.","key_concepts":[],"difficulty":null},{"start_s":395.98,"end_s":488.543,"segment_type":"concept_explanation","title":"Population Parameters Use Greek Letters (mu, mu tilde, sigma)","description":"Explains that population-model parameters are written with Greek letters — mu for the mean, mu tilde for the median, sigma squared for the variance, and sigma for the standard deviation.","key_concepts":[],"difficulty":null},{"start_s":488.543,"end_s":542.488,"segment_type":"concept_explanation","title":"Sample Statistics Use Latin Letters (x bar, tilde, s)","description":"Contrasts sample notation with the population's: Latin letters with modifier symbols — x bar for the sample mean, a tilde for the sample median, and s replacing sigma.","key_concepts":[],"difficulty":null},{"start_s":542.488,"end_s":563.6,"segment_type":"summary","title":"Recap: Greek for Populations, Latin for Samples","description":"Recaps the key convention — Greek letters for population models, Latin letters for the sample at hand — closing with the note that these tools set up the coming summary measures.","key_concepts":[],"difficulty":null}]},{"id":"lec-372b0442c109","order":10,"title":"Chapter 3.2 Measures of Central Tendency","chapter":"3.2","video_provider":"youtube","video_id":"jWyWxBhBZZY","duration_s":1650.215233,"segments":[{"start_s":1.08,"end_s":109.524,"segment_type":"concept_explanation","title":"Sample Mode: Definition and Types of Modality","description":"Introduces measures of central tendency and defines the sample mode M as the most frequent value, covering no-mode, unique, bimodal, trimodal, and multimodal cases and when the mode is actually useful.","key_concepts":[],"difficulty":null},{"start_s":109.524,"end_s":147.694,"segment_type":"example","title":"Worked Example: Mode of a Bimodal Data Set","description":"Finds the mode of the data set 1,1,2,3,3,4 by counting frequencies, showing it is bimodal with modes 1 and 3 and that the mode need not be unique.","key_concepts":[],"difficulty":null},{"start_s":147.694,"end_s":228.148,"segment_type":"concept_explanation","title":"Sample Mean: X-Bar Notation and Summation Formula","description":"Defines the sample mean x-bar as the sum of all observations divided by sample size n, introducing capital-sigma summation notation and the sample-versus-population naming convention.","key_concepts":[],"difficulty":null},{"start_s":228.148,"end_s":273.498,"segment_type":"example","title":"Worked Example: Computing the Mean of 2, 4, 6, 8","description":"Computes x-bar = (2+4+6+8)/4 = 5 by hand and notes the result happens to sit at the middle of the data, foreshadowing the median.","key_concepts":[],"difficulty":null},{"start_s":273.498,"end_s":366.874,"segment_type":"concept_explanation","title":"Sample Median: Definition and Ordering the Data","description":"Defines the sample median x-tilde as the value separating the lower 50% from the upper 50% and introduces order-statistic notation for sorting the data from smallest to largest.","key_concepts":[],"difficulty":null},{"start_s":366.874,"end_s":489.005,"segment_type":"concept_explanation","title":"Median Location Rules: Odd vs Even Sample Sizes","description":"Explains the two procedures for locating the median in sorted data: position (n+1)/2 for odd n, and averaging the values at positions n/2 and n/2+1 for even n.","key_concepts":[],"difficulty":null},{"start_s":489.005,"end_s":568.599,"segment_type":"example","title":"Worked Examples: Median for Even and Odd Data Sets","description":"Computes the median by hand for the even data set 2,4,6,8 (average of 4 and 6) and the odd data set 1,2,4,6,8 (third position), stressing that data must be sorted before indexing.","key_concepts":[],"difficulty":null},{"start_s":568.599,"end_s":724.901,"segment_type":"example","title":"Built-in R Functions: mean(), median(), and help()","description":"Shows how to compute the sample mean and median in R with the built-in mean() and median() functions, using help() pages to read arguments like trim and na.rm.","key_concepts":[],"difficulty":null},{"start_s":724.901,"end_s":757.316,"segment_type":"common_mistakes","title":"Pitfall: R's mode() Is Not the Sample Mode","description":"Warns that R's built-in mode() function reports a variable's storage type rather than the statistical sample mode, so a custom function is needed.","key_concepts":[],"difficulty":null},{"start_s":757.316,"end_s":949.631,"segment_type":"concept_explanation","title":"How to Write Your Own Function in R","description":"Explains the anatomy of a user-defined R function: naming and assignment, argument lists with optional defaults, curly-bracket bodies, and returning a single value or printing to the console.","key_concepts":[],"difficulty":null},{"start_s":949.631,"end_s":1233.384,"segment_type":"example","title":"Building the getmode Function Step by Step","description":"Constructs a custom getmode function line by line, explaining how unique, match, tabulate, and which.max combine to find the most frequent value, then asks students to run it themselves on the pets data.","key_concepts":[],"difficulty":null},{"start_s":1233.384,"end_s":1412.22,"segment_type":"example","title":"Pets Data Set: Mode, Mean, and Median by Hand","description":"Works through Miss Claridge's nine-student pet survey, computing the sample mean (5), median (4), and mode (4) by hand and noting the three measures do not all agree.","key_concepts":[],"difficulty":null},{"start_s":1412.22,"end_s":1466.834,"segment_type":"example","title":"Dot Plot: Comparing Mean, Median, and Mode Visually","description":"Introduces the dot plot and uses it to show the median and mode both sitting at 4 while the mean is pulled to 5 by the larger values in the data.","key_concepts":[],"difficulty":null},{"start_s":1466.834,"end_s":1647.8,"segment_type":"example","title":"Live R Demo: getmode Script, Help Pages, mean() and median()","description":"Runs the getmode script live in R on the pets data, explores help(unique) and its runnable examples, verifies mean() returns 5 and median() returns 4, and previews the upcoming topic of dispersion.","key_concepts":[],"difficulty":null}]},{"id":"lec-2eccc64d1778","order":11,"title":"Chapter 3.3 Measures of Variability-Spread","chapter":"3.3","video_provider":"youtube","video_id":"Bc85TbLQ11M","duration_s":829.3285,"segments":[{"start_s":0.238,"end_s":102.753,"segment_type":"introduction","title":"Why Central Tendency Alone Is Not Enough: Motivating Spread","description":"Motivates measures of variability by showing that two datasets (e.g., two countries with the same mean family income) can share central tendencies yet differ greatly in dispersion.","key_concepts":[],"difficulty":null},{"start_s":102.753,"end_s":153.816,"segment_type":"concept_explanation","title":"The Sample Range: Simplest Measure of Spread","description":"Defines the sample range as largest minus smallest value and explains why it is a useful first step but often insufficient to distinguish datasets.","key_concepts":[],"difficulty":null},{"start_s":153.816,"end_s":259.077,"segment_type":"example","title":"Three Datasets with Same Range and Center but Different Spread","description":"Walks through three datasets sharing identical range, mean, and median yet visibly different concentration, demonstrating the need for a better spread measure.","key_concepts":[],"difficulty":null},{"start_s":259.077,"end_s":366.252,"segment_type":"concept_explanation","title":"Deviations from the Sample Mean","description":"Introduces deviations as each observation minus the sample mean and illustrates them on the pets dataset, including their sign indicating direction.","key_concepts":[],"difficulty":null},{"start_s":366.252,"end_s":430.968,"segment_type":"deep_reasoning","title":"Why Deviations Around the Mean Always Sum to Zero","description":"Reasons through summing the deviations to show negatives and positives always cancel to zero around the sample mean, so their average cannot measure spread.","key_concepts":[],"difficulty":null},{"start_s":430.968,"end_s":564.754,"segment_type":"concept_explanation","title":"Defining Sample Variance and Standard Deviation (n-1 Divisor)","description":"Builds the sample variance from averaged squared deviations with the n-1 degrees-of-freedom correction, then takes the square root to define the standard deviation s (vs population sigma).","key_concepts":[],"difficulty":null},{"start_s":564.754,"end_s":631.298,"segment_type":"example","title":"Variance Distinguishes the Three Datasets","description":"Revisits the earlier three-dataset visualization to show their sample variances differ, so center plus spread can summarize data with just two numbers.","key_concepts":[],"difficulty":null},{"start_s":631.298,"end_s":781.219,"segment_type":"example","title":"Worked Example: Computing Variance and SD for the Pets Data","description":"Computes the pets dataset's variance step by step in a table (squared deviations sum to 52, divide by 8 to get 6.5, square root gives s of about 2.55) and interprets the result.","key_concepts":[],"difficulty":null},{"start_s":781.219,"end_s":827.4,"segment_type":"summary","title":"Recap of Range, Variance, and Standard Deviation","description":"Recaps the range, sample variance, and sample standard deviation procedure and previews alternative spread measures for when the mean and SD are not representative.","key_concepts":[],"difficulty":null}]},{"id":"lec-311ee979845c","order":12,"title":"Chapter 3.4 Measures of Variability-Spread Inter Quartile Range","chapter":"3.4","video_provider":"youtube","video_id":"ktc3R0fC4C8","duration_s":1911.142567,"segments":[{"start_s":0.92,"end_s":56.494,"segment_type":"introduction","title":"Why the IQR? Robust Measures of Spread","description":"Introduces the interquartile range and five-number summary as spread measures less influenced by individual points, and previews deciding when to prefer them over the mean and standard deviation.","key_concepts":[],"difficulty":null},{"start_s":56.494,"end_s":236.524,"segment_type":"concept_explanation","title":"Defining the IQR: Sample Quartiles and Percentiles","description":"Defines sample percentiles and the quartiles Q1, Q2 (the median), and Q3, then defines IQR = Q3 - Q1 as the range of the middle 50% of the data.","key_concepts":[],"difficulty":null},{"start_s":236.524,"end_s":328.717,"segment_type":"concept_explanation","title":"Quartiles Divide the Data into Four Equal Parts","description":"Uses a smooth population curve to show how Q1, Q2, and Q3 split the data into four 25% regions, with the IQR measuring the width of the middle 50%.","key_concepts":[],"difficulty":null},{"start_s":328.717,"end_s":486.456,"segment_type":"concept_explanation","title":"Computing Percentiles in R with the quantile() Function","description":"Explains that percentiles have no single computing rule and shows how to call quantile() on a data vector, pass a custom list of percentages, and access results with double-bracket notation like [[\"75%\"]].","key_concepts":[],"difficulty":null},{"start_s":486.456,"end_s":664.83,"segment_type":"example","title":"Demo: Seven Percentile Methods Give Different Answers","description":"Walks a dot-plot demo comparing R's percentile types 1-7 on the 50th, 75th, 25th, and 37th percentiles, showing the methods agree at the quartiles here but disagree elsewhere because discrete data admits no unique rule.","key_concepts":[],"difficulty":null},{"start_s":664.83,"end_s":793.966,"segment_type":"example","title":"RStudio: quantile() Help Page and the Nine Algorithm Types","description":"Opens the R documentation for quantile() to show the probs and type arguments and the nine quantile algorithms, noting the class will simply use the default type 7.","key_concepts":[],"difficulty":null},{"start_s":793.966,"end_s":1046.044,"segment_type":"concept_explanation","title":"The 1.5xIQR and 3xIQR Fence Rules for Flagging Outliers","description":"Defines inner and outer fences at Q1 and Q3 plus/minus 1.5 and 3 times the IQR, classifying points beyond them as mild or extreme explicit points that must be inspected rather than automatically declared real outliers.","key_concepts":[],"difficulty":null},{"start_s":1046.044,"end_s":1096.702,"segment_type":"concept_explanation","title":"The Five-Number Summary","description":"Defines the five-number summary (minimum, Q1, median, Q3, maximum) returned by the quantile function as the basis for visually displaying the data and its flagged points.","key_concepts":[],"difficulty":null},{"start_s":1096.702,"end_s":1261.361,"segment_type":"concept_explanation","title":"How to Draw a Modified Box Plot","description":"Gives the step-by-step construction rules: evenly spaced axis, box from Q1 to Q3, median line, computed fences, whiskers drawn to actual data points (not the fences, a mistake everyone makes), and explicitly marked outlier points.","key_concepts":[],"difficulty":null},{"start_s":1261.361,"end_s":1401.428,"segment_type":"example","title":"Example: Time-to-Promotion Data and R Code for Fences","description":"Introduces the engineer time-to-promotion dataset and writes the R code that produces its five-number summary, computes the IQR from Q3 and Q1, and builds all four inner and outer fence values.","key_concepts":[],"difficulty":null},{"start_s":1401.428,"end_s":1612.874,"segment_type":"example","title":"Example Results: IQR = 26 and Two Flagged High Points","description":"Runs the numbers for the promotion data — mean 37.3, five-number summary (7, 16, 24, 42, 150), IQR of 26, and fences — finding no low-end flags but two points exceeding the inner high fence of 81.","key_concepts":[],"difficulty":null},{"start_s":1612.874,"end_s":1760.568,"segment_type":"example","title":"Drawing the Modified Box Plot for the Promotion Data","description":"Draws the vertical box plot step by step: axis in units of 25, box from Q1 = 16 to Q3 = 42, median line at 24, whiskers extending to the data points 7 and 64, and explicit marks for points past the inner fence.","key_concepts":[],"difficulty":null},{"start_s":1760.568,"end_s":1910.5,"segment_type":"example","title":"Reading the Finished Box Plot: Mean Dot, Outlier Flags, Horizontal Version","description":"Interprets every feature of the completed plot — whiskers versus fences, the added sample-mean dot for comparing mean and median, mild versus extreme outlier flags — shows the horizontal orientation, and closes by previewing how to choose between spread measures.","key_concepts":[],"difficulty":null}]},{"id":"lec-d5e26c108e65","order":13,"title":"Chapter 3.5 Choosing Measures for Center and Spread_Resistant and Non-Resistant Measures","chapter":"3.5","video_provider":"youtube","video_id":"if-8h2DECQg","duration_s":1405.7043,"segments":[{"start_s":0.72,"end_s":43.524,"segment_type":"introduction","title":"Why Resistance Matters: Choosing Center and Spread Measures","description":"Motivates the lecture: outliers and skewness affect statistical measures, so we must learn which center/spread metrics (resistant vs non-resistant) suit a given data set.","key_concepts":[],"difficulty":null},{"start_s":43.524,"end_s":192.654,"segment_type":"example","title":"Negatively Skewed Data: Box Plot Flagged Points as Tail Behavior","description":"Walks through a negatively skewed distribution and its box plot, showing that many flagged points are just the population's tail behavior and that the IQR rule alone cannot confirm outliers.","key_concepts":[],"difficulty":null},{"start_s":192.654,"end_s":239.124,"segment_type":"concept_explanation","title":"Mean vs Median Under Skew: Non-Resistant and Resistant Measures","description":"Shows the sample mean gets pulled toward the tail while the median (50th percentile) does not, introducing x-bar as a non-resistant measure and the median as a resistant one.","key_concepts":[],"difficulty":null},{"start_s":239.124,"end_s":300.499,"segment_type":"common_mistakes","title":"Which Flagged Points Are Real Outliers?","description":"Defines real outliers as points far from the overall pattern and warns against assuming every flagged box-plot point in skewed data is a genuine outlier rather than normal tail behavior.","key_concepts":[],"difficulty":null},{"start_s":300.499,"end_s":396.794,"segment_type":"example","title":"Positively Skewed Distribution: Mean Pulled Toward the Right Tail","description":"Repeats the analysis for a positively skewed distribution, showing the mean pulled right of the median and judging which flagged points might be real outliers, a call left to the data scientist.","key_concepts":[],"difficulty":null},{"start_s":396.794,"end_s":446.204,"segment_type":"concept_explanation","title":"Choosing the Center: Prefer the Median with Strong Skew or Outliers","description":"Explains why one extreme point shifts the mean but not the median, so the sample median is the preferred center measure under strong skewness or strong outliers.","key_concepts":[],"difficulty":null},{"start_s":446.204,"end_s":536.854,"segment_type":"deep_reasoning","title":"Choosing the Spread: Why Standard Deviation Fails and IQR Resists","description":"Reasons from the formulas that s and s-squared inherit and amplify the mean's non-resistance, while the IQR built from Q1 and Q3 barely moves, making median plus IQR the pairing for skewed or outlier-heavy data.","key_concepts":[],"difficulty":null},{"start_s":536.854,"end_s":597.426,"segment_type":"concept_explanation","title":"Symmetric Data: Prefer x-bar and s for Better Inference Properties","description":"States that without strong skewness or outliers we prefer the sample mean and standard deviation because they have better properties and easier statistical inference tools.","key_concepts":[],"difficulty":null},{"start_s":597.426,"end_s":694.368,"segment_type":"example","title":"Side-by-Side Box Plots: NY Choral Society Heights by Voice Type","description":"Introduces side-by-side box plots for a quantitative variable split by a categorical variable, using 1979 NY Choral Society singer heights across soprano, alto, tenor, and bass groups.","key_concepts":[],"difficulty":null},{"start_s":694.368,"end_s":800.535,"segment_type":"common_mistakes","title":"Interpreting Group Differences: Lurking Variables and Causation Caution","description":"Cautions that observed height differences between voice types need inference and may be driven by other variables like sex, previewing one-way ANOVA later in the semester.","key_concepts":[],"difficulty":null},{"start_s":800.535,"end_s":948.412,"segment_type":"concept_explanation","title":"Standard Units: Centering at Zero and Scaling by Standard Deviation","description":"Builds the z-score transformation step by step, subtracting the mean to recenter data at zero and dividing by the standard deviation to cancel units and allow comparisons across different groups.","key_concepts":[],"difficulty":null},{"start_s":948.412,"end_s":1019.42,"segment_type":"concept_explanation","title":"Z-Scores as Relative Standing: Interpreting Values Like z = -2.25","description":"Names the z-score as a measure of relative standing and interprets specific values (z = 2, z = -2.25) as standard deviations above or below the mean, noting the homework proof that the z-scores sum to zero.","key_concepts":[],"difficulty":null},{"start_s":1019.42,"end_s":1087.04,"segment_type":"transition","title":"Looking Ahead: Point Estimation and Estimator Properties","description":"Closes the numerical-summaries unit and previews point estimation, noting the course will cover unbiasedness and normality and recommending Casella's Theory of Point Estimation for more depth.","key_concepts":[],"difficulty":null},{"start_s":1087.04,"end_s":1169.33,"segment_type":"example","title":"R Refresher: Writing Functions and the Number-of-Pets Mode Example","description":"Reviews the R function template (arguments, curly brackets, single return) and applies it to the number-of-pets data set with sort, mean, median, and the custom get-mode function returning 4.","key_concepts":[],"difficulty":null},{"start_s":1169.33,"end_s":1202.514,"segment_type":"example","title":"Using R's help() Documentation with help(tabulate)","description":"Demonstrates running help(tabulate) in R and reading the resulting documentation of arguments, details, references, and citations.","key_concepts":[],"difficulty":null},{"start_s":1202.514,"end_s":1269.277,"segment_type":"example","title":"R Blueprint: Five-Number Summary Function with Fences","description":"Presents a template function (get_fiveNumbersummary_plusFence) that computes quantiles, the IQR, and fences, outputting a data frame that can be reused for modified box plots.","key_concepts":[],"difficulty":null},{"start_s":1269.277,"end_s":1367.617,"segment_type":"example","title":"Building Box Plots in ggplot2: geom_boxplot, Error Bars, coord_flip","description":"Shows how to build a ggplot box plot from a data frame, adding stat_boxplot error bars for full whiskers, styling outlier color/shape/size, and flipping orientation with coord_flip or by swapping the axis mapping.","key_concepts":[],"difficulty":null},{"start_s":1367.617,"end_s":1404.8,"segment_type":"example","title":"Reading the Heights CSV and Plotting Side-by-Side Box Plots in R","description":"Explains reading the Brightspace heights CSV with read.csv, converting units with a provided function, and producing the side-by-side box plot, then closes the lecture pointing to probability next.","key_concepts":[],"difficulty":null}]},{"id":"lec-c1a3efefdc9a","order":14,"title":"Chapter 4.1 Basic Set Theory","chapter":"4.1","video_provider":"youtube","video_id":"xrMHgS064WE","duration_s":1895.166,"segments":[{"start_s":0.332,"end_s":40.557,"segment_type":"introduction","title":"Why Probability Needs Set Theory","description":"Motivates the move from exploring data to statistical inference, explaining that probability is the language of uncertainty and sets are the language of probability.","key_concepts":[],"difficulty":null},{"start_s":40.557,"end_s":91.55,"segment_type":"concept_explanation","title":"Random Experiments and Trials","description":"Defines a random experiment as a repeatable process with at least two unpredictable outcomes and a trial as a single execution, illustrated by rolling a six-sided die.","key_concepts":[],"difficulty":null},{"start_s":91.55,"end_s":163.09,"segment_type":"concept_explanation","title":"Outcomes and the Sample Space","description":"Introduces little omega as notation for an individual outcome and defines the sample space (capital Omega or S) as the collection of all possible outcomes.","key_concepts":[],"difficulty":null},{"start_s":163.09,"end_s":274.63,"segment_type":"concept_explanation","title":"Events, Simple Events, and the Empty Set","description":"Defines events as sets of outcomes denoted by capital letters, simple events as single-outcome events, what it means for an event to occur, and the empty set notation.","key_concepts":[],"difficulty":null},{"start_s":274.63,"end_s":418.838,"segment_type":"example","title":"20-Sided Die Example: Sample Space and Events","description":"Works through rolling a 20-sided die, enumerating the sample space 1-20, defining events E (at least 18) and simple event T (perfect 20), and showing both occur when a 20 is rolled.","key_concepts":[],"difficulty":null},{"start_s":418.838,"end_s":498.479,"segment_type":"concept_explanation","title":"Venn Diagrams for Visualizing Sets","description":"Introduces Venn diagrams, using a rectangle for the sample space and circles for events, as the visual tool for describing set relationships and overlaps.","key_concepts":[],"difficulty":null},{"start_s":498.479,"end_s":571.579,"segment_type":"concept_explanation","title":"The Complement of an Event","description":"Defines the complement A' as all outcomes in the sample space not in A, and shades the corresponding Venn diagram region to show 'everything but A'.","key_concepts":[],"difficulty":null},{"start_s":571.579,"end_s":683.439,"segment_type":"concept_explanation","title":"The Union Operation","description":"Defines A union B as all outcomes in A, in B, or both (the inclusive 'or'), describes union as a growing operation, and extends the notation to unions of n events.","key_concepts":[],"difficulty":null},{"start_s":683.439,"end_s":740.959,"segment_type":"concept_explanation","title":"Exhaustive Collections of Events","description":"Explains that a collection of events is exhaustive when their union covers the entire sample space, with an event and its complement as the simplest example.","key_concepts":[],"difficulty":null},{"start_s":740.959,"end_s":859.959,"segment_type":"concept_explanation","title":"The Intersection Operation","description":"Defines A intersect B as the outcomes the events share (the 'and' of both occurring), extends to n-event intersections, and contrasts shrinking intersections with growing unions.","key_concepts":[],"difficulty":null},{"start_s":859.959,"end_s":896.179,"segment_type":"concept_explanation","title":"Mutually Exclusive (Disjoint) Events","description":"Defines mutually exclusive or disjoint events as events whose intersection is empty, meaning they share no outcomes and cannot happen simultaneously.","key_concepts":[],"difficulty":null},{"start_s":896.179,"end_s":981.02,"segment_type":"concept_explanation","title":"Commutativity of Unions and Intersections","description":"Shows that the order of events does not matter for union or intersection, so A union B equals B union A and A intersect B equals B intersect A.","key_concepts":[],"difficulty":null},{"start_s":981.02,"end_s":1138.989,"segment_type":"concept_explanation","title":"Associativity of Unions and Intersections","description":"Demonstrates with three events that grouping does not matter when chaining unions or intersections, which justifies the compact big-union and big-intersection notation for n events.","key_concepts":[],"difficulty":null},{"start_s":1138.989,"end_s":1276.997,"segment_type":"concept_explanation","title":"Distributive Laws for Sets","description":"Explains how unions distribute over intersections and intersections distribute over unions, giving equivalent expressions that can make computations easier.","key_concepts":[],"difficulty":null},{"start_s":1276.997,"end_s":1395.211,"segment_type":"concept_explanation","title":"Subsets and Set Containment","description":"Defines the subset relation C contained in A, shows containment chains are preserved (C in A in D), and connects subsets to what intersections of nested sets yield.","key_concepts":[],"difficulty":null},{"start_s":1395.211,"end_s":1481.69,"segment_type":"summary","title":"Recap of Set Operations and Notation","description":"Recaps complement, union as 'or', intersection as 'and', disjoint events, and the subset versus subset-or-equal notation in one consolidated review.","key_concepts":[],"difficulty":null},{"start_s":1481.69,"end_s":1644.43,"segment_type":"example","title":"52-Card Deck Example: Unions and Subsets","description":"Applies set language to a standard deck of cards, building the set of red cards as the union of hearts and diamonds and showing queens form a subset of face cards.","key_concepts":[],"difficulty":null},{"start_s":1644.43,"end_s":1767.81,"segment_type":"deep_reasoning","title":"DeMorgan's First Law","description":"States that the complement of a union equals the intersection of the complements and verifies it by shading and intersecting complement regions in a three-event Venn diagram.","key_concepts":[],"difficulty":null},{"start_s":1767.81,"end_s":1895.2,"segment_type":"deep_reasoning","title":"DeMorgan's Second Law","description":"Shows that the complement of an intersection equals the union of the complements via a Venn diagram argument, notes when to switch between the equivalent forms, and closes the lecture.","key_concepts":[],"difficulty":null}]},{"id":"lec-75de7ed7c5f0","order":15,"title":"Chapter 4.2 Probability","chapter":"4.2","video_provider":"youtube","video_id":"PsanPPT3pW8","duration_s":1245.611,"segments":[{"start_s":0.17,"end_s":62.1,"segment_type":"concept_explanation","title":"Probability as a Function from Events to [0, 1]","description":"Defines probability as a function that maps events (sets) to real numbers between 0 and 1, measuring how certain or uncertain an event is to occur.","key_concepts":[],"difficulty":null},{"start_s":62.1,"end_s":129.522,"segment_type":"concept_explanation","title":"The Axioms of Probability","description":"States the axioms: probabilities lie in [0,1], the whole sample space has probability 1, the empty set has probability 0, and an event's probability is the sum of the probabilities of its outcomes.","key_concepts":[],"difficulty":null},{"start_s":129.522,"end_s":231.32,"segment_type":"concept_explanation","title":"The Frequentist Interpretation of Probability","description":"Explains probability as the limiting proportion of times an event occurs over a very large number of repeated trials, including what near-zero and near-one probabilities mean.","key_concepts":[],"difficulty":null},{"start_s":231.32,"end_s":364.91,"segment_type":"example","title":"Coin-Flip Simulation App: Long-Run Proportion of Heads","description":"Demonstrates a simulation app flipping a coin biased to 0.7 heads for 200 tosses, showing the running proportion of heads converging toward the theoretical probability.","key_concepts":[],"difficulty":null},{"start_s":364.91,"end_s":484.221,"segment_type":"concept_explanation","title":"The Bayesian Interpretation: Prior Beliefs Updated to Posterior","description":"Presents probability as a degree of belief updated by observed evidence (prior to posterior), contrasts it with the frequentist view of a flipped coin, and notes the course will stay frequentist.","key_concepts":[],"difficulty":null},{"start_s":484.221,"end_s":534.117,"segment_type":"concept_explanation","title":"The Complement Rule","description":"Derives P(E complement) = 1 - P(E) from the fact that an event and its complement partition the sample space into disjoint pieces.","key_concepts":[],"difficulty":null},{"start_s":534.117,"end_s":608.661,"segment_type":"concept_explanation","title":"General Addition Rule and the Mutually Exclusive Special Case","description":"Explains P(A union B) = P(A) + P(B) - P(A intersect B) as correcting for overcounting, and warns to use the simpler disjoint version only when mutual exclusivity is known.","key_concepts":[],"difficulty":null},{"start_s":608.661,"end_s":757.121,"segment_type":"deep_reasoning","title":"Inclusion-Exclusion for Three Events: Venn Diagram Walkthrough","description":"Builds P(A union B union C) step by step on a Venn diagram, showing why double intersections are subtracted and the triple intersection must be added back in.","key_concepts":[],"difficulty":null},{"start_s":757.121,"end_s":877.881,"segment_type":"example","title":"Two-Dice Example: Enumerating the Sample Space","description":"Sets up rolling a six-sided and a four-sided die, writes outcomes as ordered pairs in a matrix, and counts 6 times 4 = 24 possible outcomes in the sample space.","key_concepts":[],"difficulty":null},{"start_s":877.881,"end_s":993.672,"segment_type":"example","title":"Equally Likely Outcomes and Locating Events A, B, and D","description":"Assigns each of the 24 equally likely outcomes probability 1/24 and identifies which outcomes make up the events sum-of-6, sum-of-10, and rolling doubles.","key_concepts":[],"difficulty":null},{"start_s":993.672,"end_s":1103.05,"segment_type":"example","title":"Computing P(A), P(B), P(D) by Counting Favorable Outcomes","description":"Computes each event's probability as the count of outcomes in the event over the 24 total outcomes, yielding 1/6, 1/24, and 1/6, valid because outcomes are equally likely.","key_concepts":[],"difficulty":null},{"start_s":1103.05,"end_s":1245.6,"segment_type":"example","title":"Set Operations on Dice Events: A Union B, A Intersect D, No Doubles","description":"Works out P(A union B), P(A intersect D), and P(no doubles and sum of 6) both by counting outcomes directly and by applying the probability rules, then closes by pointing ahead to conditional probability.","key_concepts":[],"difficulty":null}]},{"id":"lec-9abd5799582d","order":16,"title":"Chapter 4.3 Conditional Probability","chapter":"4.3","video_provider":"youtube","video_id":"JMZDN70PDO0","duration_s":1272.6714,"segments":[{"start_s":1.69,"end_s":58.61,"segment_type":"introduction","title":"Why Conditional Probability: Updating Chances with Given Information","description":"Motivates conditional probability as how an event's chances change given information about another event, using an AI wolf-detection image example.","key_concepts":[],"difficulty":null},{"start_s":58.61,"end_s":199.63,"segment_type":"concept_explanation","title":"Defining P(A|B): The Ratio Formula and Sample-Space Restriction","description":"Defines conditional probability as P(A∩B)/P(B), explaining the bar notation, restriction of the sample space to B, relative areas in a Venn diagram, and set-minus notation.","key_concepts":[],"difficulty":null},{"start_s":199.63,"end_s":275.99,"segment_type":"example","title":"Card Deck Warm-Up: Unconditional Probabilities of Queens and Hearts","description":"Uses the 52-card deck to compute ordinary probabilities P(queen of hearts) = 1/52 and P(queen) = 1/13 before any conditioning is introduced.","key_concepts":[],"difficulty":null},{"start_s":275.99,"end_s":335.45,"segment_type":"example","title":"P(Queen Given Heart): Restricting the Deck to One Suit","description":"Computes P(queen | heart) = 1/13 by restricting to the 13 hearts, noting the probability is unchanged as a preview of independence.","key_concepts":[],"difficulty":null},{"start_s":335.45,"end_s":411.73,"segment_type":"concept_explanation","title":"General Multiplication Rule for Two Events","description":"Shows that P(A∩B) can be found as P(B|A)P(A) or P(A|B)P(B), combining conditional and unconditional information to get intersection probabilities.","key_concepts":[],"difficulty":null},{"start_s":411.73,"end_s":531.353,"segment_type":"deep_reasoning","title":"Multiplication Rule with Three or More Events: Decomposition Choices","description":"Derives how P(A∩B∩C) can be decomposed in multiple ways by grouping pairs of events and conditioning in different orders.","key_concepts":[],"difficulty":null},{"start_s":531.353,"end_s":657.093,"segment_type":"concept_explanation","title":"Tree Diagrams: Organizing Unconditional and Conditional Probabilities","description":"Builds a tree diagram with disjoint unconditional branches (A and A-complement) followed by conditional branches, and shows that multiplying along a path gives intersection probabilities.","key_concepts":[],"difficulty":null},{"start_s":657.093,"end_s":763.573,"segment_type":"example","title":"Indianapolis Trip Example: Setup, Notation, and Assumptions","description":"Sets up the Glenn and Gia trip problem, defining Friday/Saturday/Sunday and rain events, listing the three questions to answer, and stating the all-day-rain simplifying assumption.","key_concepts":[],"difficulty":null},{"start_s":763.573,"end_s":902.673,"segment_type":"example","title":"Finding P(Friday), P(Saturday), P(Sunday) from Relative Likelihoods","description":"Uses the facts that the three disjoint days sum to probability one and the given ratios (3x Saturday, 2x Sunday) to solve P(Friday) = 1/6 and the other day probabilities.","key_concepts":[],"difficulty":null},{"start_s":902.673,"end_s":1010.967,"segment_type":"example","title":"Adding Conditional Rain Probabilities to the Tree Branches","description":"Places the given rain chances (0.45, 0.25, 0.3) on the tree as conditional probabilities for each day and applies the complement rule for the no-rain branches.","key_concepts":[],"difficulty":null},{"start_s":1010.967,"end_s":1087.407,"segment_type":"example","title":"Multiplying Along Tree Paths to Get Intersection Probabilities","description":"Computes each intersection probability, such as P(rain and Sunday), by multiplying the unconditional day probability by the conditional rain probability along each tree path.","key_concepts":[],"difficulty":null},{"start_s":1087.407,"end_s":1164.107,"segment_type":"example","title":"Probability of Rain: Sum Intersections, Never the Conditionals","description":"Adds the three disjoint intersection probabilities to get about a 30% chance of rain, warning against the mistake of summing conditional probabilities instead of intersections.","key_concepts":[],"difficulty":null},{"start_s":1164.107,"end_s":1270.5,"segment_type":"example","title":"P(Friday Given No Rain): Reversing the Conditioning","description":"Applies the conditional probability formula with the tree's no-rain-and-Friday path over P(no rain) to get about 13%, closing with a preview of total probability and Bayes rule.","key_concepts":[],"difficulty":null}]},{"id":"lec-57a834dd18fe","order":17,"title":"Chapter 4.4 Law of Total Probability and Bayes Rule","chapter":"4.4","video_provider":"youtube","video_id":"4XDj9VRCVtE","duration_s":820.4196,"segments":[{"start_s":1.13,"end_s":117.534,"segment_type":"concept_explanation","title":"Partitions and the Law of Partitions","description":"After recapping the Indianapolis tree-diagram example, the lecturer defines a partition of the sample space (mutually exclusive and exhaustive events, like slices of a pizza) and states the law of partitions for computing P(B) by summing its intersections with each partition piece.","key_concepts":[],"difficulty":null},{"start_s":117.534,"end_s":226.558,"segment_type":"example","title":"Visual Example: Decomposing P(B) Over a Partition","description":"A rectangle sample space split into A1, A2, A3 illustrates how P(B) is rebuilt from its overlaps with each partition piece, connecting back to the rain tree-diagram paths and noting that A and A-complement always form the simplest partition.","key_concepts":[],"difficulty":null},{"start_s":226.558,"end_s":292.67,"segment_type":"concept_explanation","title":"The Law of Total Probability","description":"Combining the law of partitions with the general multiplication rule rewrites each intersection as an unconditional times a conditional probability, giving the law of total probability as the sum over all tree-diagram paths leading to B.","key_concepts":[],"difficulty":null},{"start_s":292.67,"end_s":361.09,"segment_type":"concept_explanation","title":"Bayes' Rule: Motivation and Statement","description":"Motivates reversing the direction of conditioning (finding P(Ai given B) from P(B given Ai)) and states Bayes' rule, with a conditional-times-unconditional numerator and a law-of-total-probability denominator that is just P(B).","key_concepts":[],"difficulty":null},{"start_s":361.09,"end_s":454.53,"segment_type":"deep_reasoning","title":"Deriving Bayes' Rule from the Conditional Probability Formula","description":"Walks through why Bayes' rule works: start from the conditional probability formula, rewrite the numerator with the general multiplication rule, decompose the denominator by the law of total probability, and use it when you have conditional information in one direction but want the other.","key_concepts":[],"difficulty":null},{"start_s":454.53,"end_s":553.15,"segment_type":"concept_explanation","title":"Interpreting Bayes' Rule: Prior, Posterior, Likelihood, Rescaling","description":"Interprets each piece of Bayes' rule in Bayesian terms: the prior beliefs about the partition events, the posterior belief we want, the likelihood measuring the information's importance, and the denominator as a rescaling factor for the conditioned-on space.","key
