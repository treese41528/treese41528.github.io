,"key_concepts":[],"difficulty":null},{"start_s":154.502,"end_s":241.678,"segment_type":"concept_explanation","title":"Degrees of Freedom and the F-Distribution","description":"Introduces the two sets of degrees of freedom (numerator k-1, denominator n-k, i.e. df1 and df2 in R) and states that the test statistic follows an F-distribution.","key_concepts":[],"difficulty":null},{"start_s":241.678,"end_s":314.175,"segment_type":"concept_explanation","title":"Properties of the F-Distribution: Positive, Right-Skewed, Mean Near 1","description":"Explains that the F-distribution is always positive, truncated at zero, right-skewed rather than symmetric, and has a mean tending to 1, which matches the null-hypothesis behavior of the statistic.","key_concepts":[],"difficulty":null},{"start_s":314.175,"end_s":397.257,"segment_type":"example","title":"How Degrees of Freedom Change the F-Curve's Shape","description":"Walks through plotted F-curves for several numerator and denominator degree-of-freedom combinations, showing skewness decrease and the curve approach normality as the degrees of freedom grow.","key_concepts":[],"difficulty":null},{"start_s":397.257,"end_s":444.142,"segment_type":"concept_explanation","title":"F Probabilities in R: pf and qf","description":"Shows that R computes F probabilities with pf and quantiles with qf, noting the F-distribution is a ratio of chi-squares with no closed-form CDF so everything is done numerically.","key_concepts":[],"difficulty":null},{"start_s":444.142,"end_s":497.893,"segment_type":"concept_explanation","title":"ANOVA Steps 1-2: Parameters and Hypotheses","description":"Lays out the first two steps of the ANOVA procedure: defining the k group means in context and stating the null of equal means against an alternative that at least one mean differs.","key_concepts":[],"difficulty":null},{"start_s":497.893,"end_s":577.297,"segment_type":"concept_explanation","title":"ANOVA Step 3: F-Statistic and p-Value with pf()","description":"Explains how to compute the F-test statistic and obtain its right-tail p-value using pf with df1, df2, and lower.tail = FALSE, rejecting when the statistic is much larger than 1.","key_concepts":[],"difficulty":null},{"start_s":577.297,"end_s":650.743,"segment_type":"concept_explanation","title":"Running ANOVA in R: aov() and summary()","description":"Demonstrates the aov(quantitative ~ factor, data) plus summary() workflow that produces the full ANOVA table, and reminds students to state conclusions in the context defined in step 1.","key_concepts":[],"difficulty":null},{"start_s":650.743,"end_s":780.253,"segment_type":"concept_explanation","title":"Reading and Completing the ANOVA Table","description":"Dissects the ANOVA table's rows and columns, shows how to fill in the total row and mean squares R omits (a likely exam task), and notes that the square root of MSE estimates the common standard deviation.","key_concepts":[],"difficulty":null},{"start_s":780.253,"end_s":855.223,"segment_type":"example","title":"Coffeehouse Example: Data and Summary Statistics","description":"Sets up the worked example of ages at five campus coffeehouses with 200 total observations, reviewing the group sample means, standard deviations, and the side-by-side boxplot that hints the null will be rejected.","key_concepts":[],"difficulty":null},{"start_s":855.223,"end_s":935.459,"segment_type":"example","title":"Coffeehouse Example: Equal-Variance Check (SD Ratio Rule)","description":"Applies the rule of thumb that the largest-to-smallest standard deviation ratio must be at most 2, computing 1.36 from the coffeehouse variances so the equal-variance assumption holds.","key_concepts":[],"difficulty":null},{"start_s":935.459,"end_s":972.086,"segment_type":"example","title":"Coffeehouse Example: Normality Check by Plotting Groups","description":"Plots the five groups on the same axes in R and judges by visual inspection that deviations from normality are mild and sample sizes are large enough for the sample means to be treated as normal.","key_concepts":[],"difficulty":null},{"start_s":972.086,"end_s":1016.436,"segment_type":"concept_explanation","title":"Residuals and QQ Plots: A Regression Preview","description":"Briefly introduces residuals and the QQ plot as an alternative normality check that will not be required for ANOVA but will return in linear regression.","key_concepts":[],"difficulty":null},{"start_s":1016.436,"end_s":1111.763,"segment_type":"example","title":"Coffeehouse Example: Hypotheses and Degrees of Freedom","description":"Carries out steps 1-3 for the coffeehouse data, defining the five mean-age parameters, stating the hypotheses, and computing degrees of freedom 4 and 195 for the F-statistic.","key_concepts":[],"difficulty":null},{"start_s":1111.763,"end_s":1188.272,"segment_type":"example","title":"Coffeehouse Example: R Output and Finishing the Table","description":"Reads the actual R ANOVA output for the coffeehouse data, showing how to complete the missing total row and arriving at an F-statistic of about 22 with a very small p-value.","key_concepts":[],"difficulty":null},{"start_s":1188.272,"end_s":1237.9,"segment_type":"example","title":"Coffeehouse Example: Rejecting H0 and Concluding in Context","description":"States the step-4 decision at alpha = 0.01, wording the conclusion in context that at least one coffeehouse differs in mean customer age, and previews the F-test versus t-test comparison coming next.","key_concepts":[],"difficulty":null}]},{"id":"lec-b445442bd1f7","order":72,"title":"Chapter 12.4 One-Way ANOVA and Two Independent Sample t-test Relationship","chapter":"12.4","video_provider":"youtube","video_id":"8hNoZPqspq0","duration_s":670.5699,"segments":[{"start_s":1,"end_s":48.656,"segment_type":"introduction","title":"ANOVA with Two Groups Equals the Pooled t-Test: Overview","description":"States the lecture's claim that with only two groups, one-way ANOVA and the two independent sample t-test with pooled variance are essentially the same procedure under the two-sided hypothesis mu1 = mu2.","key_concepts":[],"difficulty":null},{"start_s":48.656,"end_s":143.914,"segment_type":"deep_reasoning","title":"Setting k = 2: The F Denominator Is the Pooled Variance","description":"Substitutes k = 2 into the F-test statistic and shows its denominator reduces exactly to the pooled variance estimate Sp squared from the two independent sample procedure.","key_concepts":[],"difficulty":null},{"start_s":143.914,"end_s":218.124,"segment_type":"deep_reasoning","title":"Rewriting the Grand Mean as a Weighted Average of Group Means","description":"Re-expresses the overall mean x-bar-dot-dot as a sample-size-weighted average of the two group means so the F numerator can be related to the t-test's comparison of group means.","key_concepts":[],"difficulty":null},{"start_s":218.124,"end_s":439.044,"segment_type":"deep_reasoning","title":"Algebraic Simplification: Collapsing the Numerator to (x1-bar minus x2-bar) Squared","description":"Works through the term-by-term algebra of distributing, canceling, and factoring that collapses the F numerator into the squared difference of sample means over Sp squared times (1/n1 + 1/n2).","key_concepts":[],"difficulty":null},{"start_s":439.044,"end_s":532.893,"segment_type":"deep_reasoning","title":"The Punchline: F Equals t Squared and What That Implies","description":"Recognizes the simplified F statistic as the square of the two-sample t statistic, noting the p-values are identical but the right-skewed F distribution loses directional information.","key_concepts":[],"difficulty":null},{"start_s":532.893,"end_s":648.894,"segment_type":"concept_explanation","title":"t-Test vs. ANOVA: Side-by-Side Comparison and When to Use Each","description":"Compares the two procedures on variance assumptions (Welch option), available alternatives, t versus F distribution shape, null values, and number of levels, recommending the Welch t-test for two groups and ANOVA for more.","key_concepts":[],"difficulty":null},{"start_s":648.894,"end_s":668.4,"segment_type":"transition","title":"Looking Ahead: Which Means Differ? Motivating Post-Hoc Analysis","description":"Closes by noting that a significant ANOVA only says at least one mean differs, motivating the next lecture's follow-up analysis to identify which means actually differ.","key_concepts":[],"difficulty":null}]},{"id":"lec-b39836b67b8e","order":73,"title":"Chapter 12.5 Multiple Comparison Procedures Family Wise Error Rates","chapter":"12.5","video_provider":"youtube","video_id":"9BK1PxNtNjc","duration_s":2771.602167,"segments":[{"start_s":0.871,"end_s":110.683,"segment_type":"introduction","title":"Why ANOVA Significance Isn't Enough: Motivating Multiple Comparisons","description":"Explains that a significant ANOVA F-test only says at least one mean differs and previews pairwise comparisons, the family-wise error rate, and visual exploration.","key_concepts":[],"difficulty":null},{"start_s":110.683,"end_s":202.846,"segment_type":"example","title":"Visual Exploration: Side-by-Side Box Plots and Effects Plots","description":"Uses the coffeehouse side-by-side box plots and effects plot to informally spot that groups 2 and 4 look most separated before any formal testing.","key_concepts":[],"difficulty":null},{"start_s":202.846,"end_s":312.44,"segment_type":"concept_explanation","title":"Setting Up All Pairwise Pooled t-Tests","description":"Formalizes pairwise hypotheses mu_i = mu_j for every pair using the pooled two-sample procedure, with MSE estimating the equal variance inherited from the ANOVA assumptions.","key_concepts":[],"difficulty":null},{"start_s":312.44,"end_s":365.348,"segment_type":"common_mistakes","title":"The Multiple Testing Problem: Per-Test Alpha Inflates Overall Error","description":"Shows that naively running each of many tests at alpha = 5% makes the chance of at least one Type I error far exceed 5%, so error must be controlled overall.","key_concepts":[],"difficulty":null},{"start_s":365.348,"end_s":492.005,"segment_type":"concept_explanation","title":"Defining the Family-Wise Error Rate","description":"Defines the FWER as the probability of at least one false positive across all pairwise comparisons and outlines controlling it via modified per-test alphas or critical values.","key_concepts":[],"difficulty":null},{"start_s":492.005,"end_s":696.395,"segment_type":"deep_reasoning","title":"Two-Test Picture: Where Joint Type I Errors Come From","description":"Uses overlapping rejection regions for two normal test statistics to show errors can occur on one test, the other, or both, so total error exceeds the single-test alpha.","key_concepts":[],"difficulty":null},{"start_s":696.395,"end_s":846.459,"segment_type":"deep_reasoning","title":"Computing FWER Under Independence: 1-(1-alpha)^2 and the Binomial View","description":"Derives the probability of at least one false positive for two independent tests case by case and frames the error count as a binomial distribution.","key_concepts":[],"difficulty":null},{"start_s":846.459,"end_s":974.064,"segment_type":"concept_explanation","title":"The Sidak Correction for k-Choose-2 Comparisons","description":"Generalizes to c = k-choose-2 comparisons and inverts alpha_overall = 1-(1-alpha_single)^c to solve for the per-test alpha, the Sidak correction.","key_concepts":[],"difficulty":null},{"start_s":974.064,"end_s":1113.904,"segment_type":"example","title":"Sidak in Action: Naive 0.05 Gives a 0.4 Family-Wise Error","description":"Works the coffeehouse numbers (k=5, 10 comparisons) showing a naive per-test 0.05 yields roughly a 0.40 FWER while the Sidak-corrected per-test alpha is about 0.005.","key_concepts":[],"difficulty":null},{"start_s":1113.904,"end_s":1335.104,"segment_type":"deep_reasoning","title":"Bonferroni Correction via Boole's Inequality","description":"Bounds the probability of at least one rejection using inclusion-exclusion and Boole's inequality to derive the Bonferroni per-test alpha of alpha divided by c.","key_concepts":[],"difficulty":null},{"start_s":1335.104,"end_s":1386.993,"segment_type":"concept_explanation","title":"Plugging Corrected Alphas into the t Critical Value","description":"Shows that applying Sidak or Bonferroni only changes the critical value t(alpha_single/2, n-k) in the pooled confidence interval formula.","key_concepts":[],"difficulty":null},{"start_s":1386.993,"end_s":1488.94,"segment_type":"concept_explanation","title":"Why Bonferroni and Sidak Are Conservative","description":"Explains that both corrections are overly restrictive, producing wider intervals than needed, which reduces power and inflates Type II error, motivating a better method.","key_concepts":[],"difficulty":null},{"start_s":1488.94,"end_s":1574.588,"segment_type":"concept_explanation","title":"Tukey's HSD and the Tukey-Kramer Extension","description":"Introduces Tukey's honestly-significant-difference approach that controls FWER by replacing the critical value to control the largest mean difference, with Tukey-Kramer handling unequal sample sizes.","key_concepts":[],"difficulty":null},{"start_s":1574.588,"end_s":1680.785,"segment_type":"concept_explanation","title":"The Studentized Range Distribution and the q Critical Value","description":"Explains q as the standardized range of sample means (largest minus smallest x-bar over the MSE-based standard error), its k and n-k degrees of freedom, and the root-2 factor.","key_concepts":[],"difficulty":null},{"start_s":1680.785,"end_s":1785.468,"segment_type":"example","title":"Getting Tukey Critical Values in R with qtukey","description":"Demonstrates the qtukey function with lower.tail TRUE/FALSE options and its parameters, dividing by root 2 to build the margin of error for confidence intervals.","key_concepts":[],"difficulty":null},{"start_s":1785.468,"end_s":1868.785,"segment_type":"example","title":"Automating the Procedure with R's TukeyHSD Function","description":"Shows fitting the ANOVA with aov and passing the fit to TukeyHSD with ordered=TRUE and a confidence level so R constructs all pairwise intervals automatically.","key_concepts":[],"difficulty":null},{"start_s":1868.785,"end_s":1944.847,"segment_type":"concept_explanation","title":"Dunnett's Method for Comparing Treatments to a Control","description":"Describes Dunnett's procedure that controls the FWER over only k-1 treatment-versus-control comparisons and notes a bonus computer assignment to find an R library implementing it.","key_concepts":[],"difficulty":null},{"start_s":1944.847,"end_s":2032.781,"segment_type":"concept_explanation","title":"Underline Diagrams: Displaying Which Means Are Indistinguishable","description":"Lays out the display procedure of ordering sample means from smallest to largest, underlining non-significant neighboring pairs, and merging lines across extended neighborhoods.","key_concepts":[],"difficulty":null},{"start_s":2032.781,"end_s":2303.705,"segment_type":"example","title":"Three Worked Underline Diagrams with Populations A-D","description":"Walks through three A/B/C/D scenarios showing how to draw and merge underlines and how to interpret ambiguous cases where lines cannot be merged.","key_concepts":[],"difficulty":null},{"start_s":2303.705,"end_s":2340.187,"segment_type":"summary","title":"Recap: Steps for the Underline Visualization","description":"Briefly restates the routine: order the sample means, underline non-significant neighbors, merge lines where possible, then conclude about the population means.","key_concepts":[],"difficulty":null},{"start_s":2340.187,"end_s":2416.051,"segment_type":"summary","title":"The Complete ANOVA-to-Multiple-Comparisons Workflow","description":"Recaps the full pipeline: significant ANOVA, choose a family-wise alpha, apply Tukey HSD or Dunnett's, check which intervals contain zero, visualize, and summarize the relationships.","key_concepts":[],"difficulty":null},{"start_s":2416.051,"end_s":2601.444,"segment_type":"example","title":"Coffeehouse Example: Running TukeyHSD and Reading the Output","description":"Applies TukeyHSD to the fitted coffeehouse ANOVA and checks each pairwise interval for zero to flag significance, including one borderline interval.","key_concepts":[],"difficulty":null},{"start_s":2601.444,"end_s":2734.794,"segment_type":"example","title":"Coffeehouse Example: Building the Underline Display and Interpreting","description":"Orders the coffeehouse means, underlines the two non-significant pairs (1-5 and 1-3), and interprets coffeehouse 4 as having the youngest and coffeehouse 2 the oldest average customers.","key_concepts":[],"difficulty":null},{"start_s":2734.794,"end_s":2769.0,"segment_type":"summary","title":"Closing Summary of the Full Procedure","description":"Recaps the entire one-way ANOVA multiple-comparison procedure from statistical significance through Tukey HSD to the final visual display and conclusions.","key_concepts":[],"difficulty":null}]},{"id":"lec-e89fc247f670","order":74,"title":"Chapter 13.1 Correlation and Regression- Simple Linear Regression","chapter":"13.1","video_provider":"youtube","video_id":"NfbWwbuUVEg","duration_s":906.038467,"segments":[{"start_s":0.6,"end_s":224.567,"segment_type":"introduction","title":"Introducing Linear Regression and Reviewing One-Sample Inference","description":"Announces linear regression as the final topic (two quantitative variables) and reviews one-sample inference for a mean — hypothesis tests, confidence intervals, z vs. t — reframed as a normal-error model x_i = mu + epsilon.","key_concepts":[],"difficulty":null},{"start_s":224.567,"end_s":389.379,"segment_type":"summary","title":"Review: Two-Sample Independent Procedures as a Model","description":"Recaps independent two-sample inference — two populations as a factor with two levels, normal-error models per group, z vs. t statistics, and the Welch approximation for unequal variances.","key_concepts":[],"difficulty":null},{"start_s":389.379,"end_s":502.824,"segment_type":"summary","title":"Review: Paired Samples as a Model on Differences","description":"Recaps the paired-sample procedure, where the model is placed on the pairwise differences with mean mu_a - mu_b and normal errors, reducing inference to a one-sample procedure on the differences.","key_concepts":[],"difficulty":null},{"start_s":502.824,"end_s":643.427,"segment_type":"summary","title":"Review: One-Way ANOVA Model and the F Test","description":"Recaps one-way ANOVA for k group means — equal-variance normal-error model, MSA and MSE as variance estimators, and the F statistic that rejects equality of means when the ratio is large.","key_concepts":[],"difficulty":null},{"start_s":643.427,"end_s":754.768,"segment_type":"concept_explanation","title":"Association vs. Causation with Two Quantitative Variables","description":"Defines association (changes in one variable accompany changes in the other) versus causation, and cautions that regression models establish association only, since causation requires a well-designed experiment.","key_concepts":[],"difficulty":null},{"start_s":754.768,"end_s":904.6,"segment_type":"concept_explanation","title":"The Simple Linear Regression Model: y = g(x) + Error","description":"Introduces the regression model with response (dependent) variable y, explanatory (independent) variable x, the regression function g assumed linear, and the error term epsilon capturing unexplained variation, closing with a pointer to scatter plots.","key_concepts":[],"difficulty":null}]},{"id":"lec-f285fe449f4e","order":75,"title":"Chapter 13.2 Scatter Plots","chapter":"13.2","video_provider":"youtube","video_id":"5wECoca89ls","duration_s":1266.0648,"segments":[{"start_s":1.48,"end_s":82.204,"segment_type":"introduction","title":"Scatterplots: Definition and Choosing Explanatory vs. Response Variables","description":"Introduces the scatterplot as a graphical display of two quantitative variables and explains how to decide which variable is explanatory (x) and which is the response (y).","key_concepts":[],"difficulty":null},{"start_s":82.204,"end_s":244.036,"segment_type":"example","title":"Worked Example: Plotting Car Cylinder Volume vs. Horsepower by Hand","description":"Constructs a scatterplot manually from a 2006 fuel-efficient car data set, choosing cylinder volume as x and horsepower as y, picking axis ranges, and plotting all eight ordered pairs.","key_concepts":[],"difficulty":null},{"start_s":244.036,"end_s":417.904,"segment_type":"example","title":"Making the Scatterplot in R with ggplot and geom_smooth","description":"Demonstrates building a data frame and using ggplot with geom_point and geom_smooth(method=lm) to draw the scatterplot with a best fitting line, then reads off that a linear form fits the car data.","key_concepts":[],"difficulty":null},{"start_s":417.904,"end_s":483.547,"segment_type":"concept_explanation","title":"What Scatterplots Reveal: Form, Direction, Strength, and Outliers","description":"Previews the four things a scatterplot lets us assess — the form of the association, its direction and strength when linear, and outliers or influential observations.","key_concepts":[],"difficulty":null},{"start_s":483.547,"end_s":598.403,"segment_type":"concept_explanation","title":"Form of the Association: Linear, Non-linear, Clusters, or No Pattern","description":"Defines form as the general shape of the x-y relationship and surveys the possibilities — linear, non-linear or transformable, clustered, thresholds/breakpoints, or no association at all.","key_concepts":[],"difficulty":null},{"start_s":598.403,"end_s":763.115,"segment_type":"example","title":"Recognizing Non-linear Forms: Exponential, Parabolic, Logarithmic, Sinusoidal","description":"Walks through four example scatterplots of non-linear relationships, explaining why each is not linear and when strength and direction can still be conveyed.","key_concepts":[],"difficulty":null},{"start_s":763.115,"end_s":933.9,"segment_type":"concept_explanation","title":"Direction of a Linear Association: Positive, Negative, or No Trend","description":"Explains direction using example plots — upward trends indicate positive (direct) association, downward trends indicate negative (inverse) association, and a horizontal random scatter indicates no relationship.","key_concepts":[],"difficulty":null},{"start_s":933.9,"end_s":1010.6,"segment_type":"concept_explanation","title":"Strength of the Association: How Tightly Points Follow the Line","description":"Defines strength as how closely the points conform to the linear pattern, contrasting strong clear-pattern associations with weak random-looking scatter.","key_concepts":[],"difficulty":null},{"start_s":1010.6,"end_s":1154.996,"segment_type":"example","title":"Judging Strength Visually: Perfect to Strong, Moderate, Weak, and None","description":"Steps through a spectrum of example scatterplots from perfect negative linear association through strong, moderate, and weak trends to no association, then repeats the progression for positive trends.","key_concepts":[],"difficulty":null},{"start_s":1154.996,"end_s":1265.7,"segment_type":"concept_explanation","title":"Outliers and Influential Points on Scatterplots","description":"Defines outliers with respect to either axis and influential points that drastically change the fitted slope and intercept, cautioning that not all outliers are influential and not all influential points are outliers.","key_concepts":[],"difficulty":null}]},{"id":"lec-cde23f77b9e2","order":76,"title":"Chapter 13.3 Simple Linear Regression Model","chapter":"13.3","video_provider":"youtube","video_id":"a9skiqjau8I","duration_s":2362.326633,"segments":[{"start_s":0.84,"end_s":36.994,"segment_type":"introduction","title":"Recap: From Scatter Plots to Needing a Best-Fitting Line","description":"Recaps the regression workflow so far (choosing explanatory vs. response, confirming linearity via scatter plots) and previews the goal of finding the best intercept and slope.","key_concepts":[],"difficulty":null},{"start_s":36.994,"end_s":129.274,"segment_type":"concept_explanation","title":"The Population-Level Model: Y = beta0 + beta1 x + epsilon","description":"Defines the population simple linear regression model and interprets the parameters beta0 (intercept), beta1 (slope as average change per unit x), and the epsilon error term.","key_concepts":[],"difficulty":null},{"start_s":129.274,"end_s":223.364,"segment_type":"concept_explanation","title":"Model Assumptions: iid Normal Errors with Common Variance","description":"States the SLR assumptions: linearity, the response as a random variable at each fixed x, and errors that are iid normal with mean 0 and common variance sigma squared.","key_concepts":[],"difficulty":null},{"start_s":223.364,"end_s":346.194,"segment_type":"deep_reasoning","title":"Deriving E(Y) and Var(Y): The Mean Response Line","description":"Derives that the expected response for each fixed x follows the mean response line beta0 + beta1 x and that Var(Y) equals sigma squared since only the errors are random.","key_concepts":[],"difficulty":null},{"start_s":346.194,"end_s":496.796,"segment_type":"concept_explanation","title":"Visualizing Normal Distributions Around the Regression Line","description":"Visualizes the model as a normal distribution of responses centered on the line at every fixed x, drawing an analogy to ANOVA but with a continuous set of populations (e.g., weight given height).","key_concepts":[],"difficulty":null},{"start_s":496.796,"end_s":580.126,"segment_type":"concept_explanation","title":"What We Must Estimate: Intercept, Slope, and Variance","description":"Explains that from data we must estimate beta0, beta1, and sigma squared, which then enables estimating the mean response line, inference, and confidence intervals.","key_concepts":[],"difficulty":null},{"start_s":580.126,"end_s":668.07,"segment_type":"summary","title":"Formal Restatement of the SLR Assumptions","description":"Restates the assumptions as a checklist — responses are a simple random sample at each fixed x, x's are not random, the relationship is linear, and errors are iid normal with constant standard deviation — to be checked later.","key_concepts":[],"difficulty":null},{"start_s":668.07,"end_s":824.016,"segment_type":"concept_explanation","title":"Least Squares Criterion: Minimizing Squared Deviations","description":"Motivates the best-fitting line y-hat as the one minimizing the distance between observed and predicted values on average, and justifies measuring that distance with squared deviations.","key_concepts":[],"difficulty":null},{"start_s":824.016,"end_s":982.815,"segment_type":"deep_reasoning","title":"Framing Least Squares as a Calculus Minimization Problem","description":"Sets up the argument-minimization of the sum of squared errors over beta0 and beta1, explaining partial derivatives for non-calc-3 students and why the sum of squares guarantees a minimum.","key_concepts":[],"difficulty":null},{"start_s":982.815,"end_s":1095.215,"segment_type":"deep_reasoning","title":"Deriving the Intercept Estimate: b0 = y-bar minus b1 x-bar","description":"Takes the partial derivative with respect to beta0, sets it to zero, and solves to show the intercept estimate is y-bar minus the (still unknown) slope times x-bar.","key_concepts":[],"difficulty":null},{"start_s":1095.215,"end_s":1387.615,"segment_type":"deep_reasoning","title":"Deriving the Slope Estimate b1 via Partial Derivatives","description":"Differentiates with respect to beta1 (illustrated with a two-observation case), substitutes the intercept expression, and solves algebraically for the slope formula in terms of the data alone.","key_concepts":[],"difficulty":null},{"start_s":1387.615,"end_s":1592.603,"segment_type":"concept_explanation","title":"Slope as Sample Covariance over Variance: Sxy/Sxx Notation","description":"Rewrites b1 as sample covariance of x and y divided by sample variance of x, introduces the capital-S (sum of squares) versus little-s (mean square) notation, and switches to b0/b1 labels for the fitted line.","key_concepts":[],"difficulty":null},{"start_s":1592.603,"end_s":1676.563,"segment_type":"concept_explanation","title":"Interpreting the Slope and Intercept","description":"Interprets b1 as the average change in the response per one-unit change in x (with sign giving direction) and cautions that the intercept may be a meaningless artifact when x = 0 is not possible.","key_concepts":[],"difficulty":null},{"start_s":1676.563,"end_s":1730.375,"segment_type":"deep_reasoning","title":"The Fitted Line Always Passes Through (x-bar, y-bar)","description":"Shows algebraically that plugging x-bar into the fitted line returns y-bar, which serves as a quick sanity check on computed coefficients.","key_concepts":[],"difficulty":null},{"start_s":1730.375,"end_s":1783.186,"segment_type":"common_mistakes","title":"Pitfall: You Cannot Swap X and Y Without Refitting","description":"Warns that inverting the fitted line to swap explanatory and response variables is not equivalent to refitting the regression with the roles exchanged, so the roles must be fixed up front.","key_concepts":[],"difficulty":null},{"start_s":1783.186,"end_s":1883.398,"segment_type":"real_world_application","title":"Blood Pressure Treatment Example: Study Setup","description":"Introduces the worked example — a trial of 11 subjects testing whether age (x) is linearly associated with the 24-hour change in systolic blood pressure (y = after minus before) under a new treatment.","key_concepts":[],"difficulty":null},{"start_s":1883.398,"end_s":1987.496,"segment_type":"example","title":"Scatter Plot in R with ggplot: Checking Linearity","description":"Builds the scatter plot in R (data frame, ggplot, geom_point, geom_abline for the x-axis) and reads it to confirm mostly negative changes and a plausible downward linear trend.","key_concepts":[],"difficulty":null},{"start_s":1987.496,"end_s":2168.334,"segment_type":"example","title":"Computing the Slope (-0.526) and Intercept (20.11) by Hand","description":"Plugs the summary statistics (means, sum of xi squared, sum of xi yi, n = 11) into the least-squares formulas to obtain b1 = -0.526 and b0 = 20.11, noting the intercept has no physical meaning at age 0.","key_concepts":[],"difficulty":null},{"start_s":2168.334,"end_s":2217.326,"segment_type":"example","title":"Adding the Regression Line to the ggplot","description":"Overlays the fitted line on the scatter plot using geom_smooth or geom_abline and annotates the plot with the regression equation via the latex2exp package.","key_concepts":[],"difficulty":null},{"start_s":2217.326,"end_s":2360.6,"segment_type":"example","title":"Prediction at Age 65 and Computing a Residual","description":"Uses the fitted line to predict a change of -14 mmHg for a 65-year-old, compares it to the observed -8, and computes the residual of 6 as observed minus predicted, closing with a pointer to studying estimator variability next.","key_concepts":[],"difficulty":null}]},{"id":"lec-6fcc1520fdb3","order":77,"title":"Chapter 13.4 Simple Linear Regression ANOVA Table and Coefficient of Determination","chapter":"13.4","video_provider":"youtube","video_id":"nD9hKHIaUIQ","duration_s":1895.3935,"segments":[{"start_s":1.24,"end_s":132.864,"segment_type":"introduction","title":"Review: Simple Linear Regression Model and Least-Squares Estimates","description":"Introduces the goal of assessing the fitted model via the coefficient of determination and reviews the population model, IID normal error assumptions, and the least-squares formulas for the slope and intercept.","key_concepts":[],"difficulty":null},{"start_s":132.864,"end_s":207.936,"segment_type":"concept_explanation","title":"Residual Errors and the Mean Squared Error Estimate of Sigma-Squared","description":"Defines residuals as observed minus predicted responses and shows how summing their squares and dividing by n-2 degrees of freedom yields the mean squared error estimate of the common variance.","key_concepts":[],"difficulty":null},{"start_s":207.936,"end_s":416.6,"segment_type":"concept_explanation","title":"The Regression ANOVA Table: SSR, SSE, SST and Degrees of Freedom","description":"Builds the ANOVA table for simple linear regression, explaining the regression, error, and total sources of variation, the decomposition SST = SSR + SSE, the degrees of freedom (1, n-2, n-1), and the resulting mean squares.","key_concepts":[],"difficulty":null},{"start_s":416.6,"end_s":526.49,"segment_type":"concept_explanation","title":"Defining the Coefficient of Determination (R-Squared = SSR/SST)","description":"Defines R-squared as the ratio of sum of squares regression to sum of squares total and interprets it as the fraction (or percentage) of variation in the response explained by the least-squares regression.","key_concepts":[],"difficulty":null},{"start_s":526.49,"end_s":786.039,"segment_type":"deep_reasoning","title":"Deriving 1-R-Squared = SSE/SST and Reasoning About the Extremes","description":"Derives that 1-R-squared equals SSE/SST and reasons through limiting cases: R-squared approaches 1 when predictions approach the observed responses, while 1-R-squared approaches 1 when predictions collapse to y-bar, signaling a useless model.","key_concepts":[],"difficulty":null},{"start_s":786.039,"end_s":921.478,"segment_type":"common_mistakes","title":"Pitfall: High R-Squared Does Not Mean the Relationship Is Linear","description":"Uses a sinusoidal-data example with R-squared of 0.9 to warn that a high R-squared can disguise a nonlinear relationship, so the scatter plot must always be inspected before trusting a linear fit.","key_concepts":[],"difficulty":null},{"start_s":921.478,"end_s":1073.374,"segment_type":"common_mistakes","title":"Pitfall: R-Squared Is Not Robust to Outliers","description":"Shows how a single extreme outlier in the response inflates SST and drags R-squared down to about 0.17 despite a strong underlying linear relationship, motivating outlier inspection and refitting without suspect points.","key_concepts":[],"difficulty":null},{"start_s":1073.374,"end_s":1165.574,"segment_type":"common_mistakes","title":"Pitfall: Large R-Squared Does Not Guarantee Good Predictions","description":"Uses a 9-million-over-10-million sum-of-squares example to show that even with R-squared of 0.9 the absolute magnitude of unexplained variation can be huge, so predictions may still be far off.","key_concepts":[],"difficulty":null},{"start_s":1165.574,"end_s":1353.412,"segment_type":"common_mistakes","title":"Full Checklist of R-Squared Caveats: Lurking Variables, Small Samples, Extrapolation, Assumptions","description":"Enumerates the complete list of conditions to check before trusting R-squared: possible nonlinearity, outliers, lurking variables, measurement error, small-sample sampling artifacts, no extrapolation beyond the data range, and assumption violations like non-constant variance.","key_concepts":[],"difficulty":null},{"start_s":1353.412,"end_s":1444.297,"segment_type":"example","title":"Blood Pressure Example: Recap of Data and Fitted Line, Plan for the ANOVA Table","description":"Returns to the systolic blood pressure versus age example (n=11, intercept about 20, slope -0.526) and lays out the plan to compute SSR, SSE, and SST to complete the ANOVA table and find R-squared.","key_concepts":[],"difficulty":null},{"start_s":1444.297,"end_s":1649.343,"segment_type":"deep_reasoning","title":"Derivation of the SSR Shortcut: SSR = b1 times Sxy","description":"Algebraically substitutes the fitted line into the SSR formula to derive the computational shortcut SSR = b1^2 Sxx = b1 Sxy, and argues why this quantity is always non-negative since b1 and Sxy share the same sign.","key_concepts":[],"difficulty":null},{"start_s":1649.343,"end_s":1823.884,"segment_type":"example","title":"Blood Pressure Example: Computing SSR = 556, SST = 939, SSE = 383 and Filling the ANOVA Table","description":"Numerically computes Sxy, SSR, SST, and SSE for the blood pressure data, fills in the degrees of freedom (1, 9, 10) and mean squares, and notes the F-statistic and p-value will be covered later.","key_concepts":[],"difficulty":null},{"start_s":1823.884,"end_s":1894.6,"segment_type":"example","title":"Blood Pressure Example: R-Squared = 0.592 and Its Interpretation","description":"Computes the coefficient of determination from the completed table and interprets it: about 59.2% of the variation in blood pressure change is explained by the regression on age, previewing the related correlation measure to come.","key_concepts":[],"difficulty":null}]},{"id":"lec-9a4caf640108","order":78,"title":"Chapter 13.5 Sample Pearson Correlation Coefficient","chapter":"13.5","video_provider":"youtube","video_id":"qSG28mV6fx4","duration_s":1168.600767,"segments":[{"start_s":0.8,"end_s":45.912,"segment_type":"introduction","title":"What the Sample Pearson Correlation Coefficient Measures","description":"Introduces r as a measure of the strength and direction of the linear association between two quantitative variables, specifically the explanatory and response variables.","key_concepts":[],"difficulty":null},{"start_s":45.912,"end_s":123.859,"segment_type":"concept_explanation","title":"Formula for r: Sample Covariance over Standard Deviations","description":"Presents the summation formula for r, rewrites it as sample covariance divided by the two sample standard deviations, and interprets what the covariance captures about x and y moving above or below their means.","key_concepts":[],"difficulty":null},{"start_s":123.859,"end_s":177.364,"segment_type":"concept_explanation","title":"r as an Estimator of the Population Correlation","description":"Connects the sample statistic r to the population correlation from earlier probability chapters, showing each sample quantity estimates its population counterpart.","key_concepts":[],"difficulty":null},{"start_s":177.364,"end_s":279.907,"segment_type":"concept_explanation","title":"Rewriting r as an Average Product of z-Scores","description":"Rearranges the formula to show r is an average product of standardized x and y values, making it a unitless measure of how many standard deviations observations sit from their means.","key_concepts":[],"difficulty":null},{"start_s":279.907,"end_s":313.872,"segment_type":"concept_explanation","title":"r Is Always Between -1 and +1","description":"States the boundedness property of r (provable via the Cauchy-Schwarz inequality) and explains why this makes correlations comparable across different variable pairs.","key_concepts":[],"difficulty":null},{"start_s":313.872,"end_s":394.504,"segment_type":"concept_explanation","title":"Rule of Thumb: Strong, Moderate, and Weak Correlations","description":"Gives the sign-equals-direction interpretation and the numeric cutoffs for strong (0.8-1), moderate (0.5-0.8), and weak (below 0.5) associations, with r near 0 meaning little linear association.","key_concepts":[],"difficulty":null},{"start_s":394.504,"end_s":448.621,"segment_type":"example","title":"Scatter Plots Across the Range of r Values","description":"Walks through a gallery of scatter plots showing how downward and upward trends tighten as r approaches -1 or +1 and dissolve into a shapeless cloud near 0.","key_concepts":[],"difficulty":null},{"start_s":448.621,"end_s":556.56,"segment_type":"common_mistakes","title":"When r = 0: Nonlinear Patterns and Symmetry","description":"Warns that r = 0 can occur with curved, clustered, or non-functional patterns that are strongly associated but nonlinear, because symmetric regions cancel out in the sum.","key_concepts":[],"difficulty":null},{"start_s":556.56,"end_s":744.964,"segment_type":"deep_reasoning","title":"Deriving the Link Between r and the Slope b1","description":"Algebraically substitutes the covariance into the slope formula to show b1 = r(Sy/Sx), interpreting the slope as the correlation rescaled into the units of the data.","key_concepts":[],"difficulty":null},{"start_s":744.964,"end_s":920.338,"segment_type":"deep_reasoning","title":"Proving R-squared Equals r-squared in Simple Linear Regression","description":"Recaps the coefficient of determination SSR/SST and derives step by step that in simple linear regression it equals the square of the sample Pearson correlation coefficient.","key_concepts":[],"difficulty":null},{"start_s":920.338,"end_s":972.239,"segment_type":"concept_explanation","title":"Capital R-squared vs Little r-squared in Multiple Regression","description":"Explains that the equivalence holds only with one explanatory variable, since capital R-squared assesses overall model utility while little r compares just two quantitative variables.","key_concepts":[],"difficulty":null},{"start_s":972.239,"end_s":1059.875,"segment_type":"concept_explanation","title":"Recovering r from R-squared: Choosing the Sign","description":"Shows that r equals plus-or-minus the square root of R-squared, with the sign determined from the scatter plot's direction or the sign of the estimated slope.","key_concepts":[],"difficulty":null},{"start_s":1059.875,"end_s":1129.206,"segment_type":"common_mistakes","title":"Limitations of r: Nonlinearity and Outliers","description":"Cautions that r inherits R-squared's weaknesses—it is meaningless for nonlinear relationships, is not robust to outliers, and must always be checked against the scatter plot.","key_concepts":[],"difficulty":null},{"start_s":1129.206,"end_s":1166.9,"segment_type":"summary","title":"Recap and Preview: Toward Hypothesis Testing for Model Utility","description":"Recaps that r is informative only alongside scatter plot checks for nonlinearity, and previews hypothesis testing for model utility after covering model assumptions and diagnostics.","key_concepts":[],"difficulty":null}]},{"id":"lec-72cd12c806aa","order":79,"title":"Chapter 13.6 Diagonostics for Model Assumptions","chapter":"13.6","video_provider":"youtube","video_id":"p8kRL-vUpVo","duration_s":1234.266367,"segments":[{"start_s":1.16,"end_s":36.434,"segment_type":"introduction","title":"Why We Must Diagnose Model Assumptions Before Inference","description":"Motivates the chapter: if the regression model assumptions are strongly violated, statistical inference results cannot be trusted, so we need diagnostic checks first.","key_concepts":[],"difficulty":null},{"start_s":36.434,"end_s":121.074,"segment_type":"concept_explanation","title":"Recall: The IID Simple Random Sample Assumption for Fixed X","description":"Reviews the assumption that x values are fixed in advance and the responses form a simple random sample (IID) at each fixed x, as in an experimental design.","key_concepts":[],"difficulty":null},{"start_s":121.074,"end_s":190.592,"segment_type":"concept_explanation","title":"Linearity and Normal Error-Term Assumptions","description":"States the linearity assumption and the assumption that the population errors epsilon are IID normal with mean zero and common variance sigma squared.","key_concepts":[],"difficulty":null},{"start_s":190.592,"end_s":266.745,"segment_type":"deep_reasoning","title":"How Error Assumptions Imply the Distribution of the Responses","description":"Derives that because the errors are normal with mean zero and the x's are fixed, each response Yi is normal with mean on the regression line and common variance sigma squared.","key_concepts":[],"difficulty":null},{"start_s":266.745,"end_s":313.714,"segment_type":"concept_explanation","title":"Checking Linearity and Constant Variance with Scatter Plots","description":"Explains that scatter plots can check the linearity and constant-variance (homoscedasticity) assumptions by examining spread around the fitted line, but cannot check normality.","key_concepts":[],"difficulty":null},{"start_s":313.714,"end_s":430.184,"segment_type":"example","title":"Example: Tracing Spread in the Blood Pressure vs Age Scatter Plot","description":"Works through the blood pressure vs age example, tracing the spread across the scatter plot to judge the constant-variance assumption and concluding there are no strong violations despite sparse data.","key_concepts":[],"difficulty":null},{"start_s":430.184,"end_s":637.313,"segment_type":"concept_explanation","title":"Residual Plots: Definition and Construction","description":"Introduces the residual plot as a better tool than finger-tracing, showing how each residual (observed minus predicted, e.g., Honda's horsepower) is plotted against x for the car efficiency data to make spread easier to assess.","key_concepts":[],"difficulty":null},{"start_s":637.313,"end_s":749.207,"segment_type":"concept_explanation","title":"Non-Constant Variance Patterns: Funnel, Hourglass, and Reverse Cone","description":"Shows the telltale residual-plot patterns (increasing funnel, hourglass, reverse cone) that indicate variance is a function of x, meaning a strong constant-variance violation requiring methods like weighted regression.","key_concepts":[],"difficulty":null},{"start_s":749.207,"end_s":812.619,"segment_type":"concept_explanation","title":"Checking Linearity: A Good Residual Plot Is Random Scatter","description":"Explains that a valid model produces a patternless, evenly spread random scatter of residuals above and below the x-axis, while any pattern signals a linearity violation.","key_concepts":[],"difficulty":null},{"start_s":812.619,"end_s":901.353,"segment_type":"deep_reasoning","title":"Why Fitting a Line to a Quadratic Truth Creates Residual Patterns","description":"Reasons through what happens when the true population model is quadratic but a line is fit: the unmodeled curvature gets pushed into the residuals, producing visible patterns that signal the need for a more complex model or transformation.","key_concepts":[],"difficulty":null},{"start_s":901.353,"end_s":962.12,"segment_type":"concept_explanation","title":"Assessing Normality with Histograms and QQ Plots of Residuals","description":"Explains that normality is checked by plotting the residuals e_i = y_i minus y_i-hat in a histogram (should look normal) and a QQ plot (should follow a line), just as done earlier for raw data.","key_concepts":[],"difficulty":null},{"start_s":962.12,"end_s":1098.236,"segment_type":"example","title":"Worked Example 1: Diagnosing a Constant-Variance Violation","description":"Reads all four diagnostic plots for a dataset with a bulging middle, identifying a constant-variance violation and noting it must be remedied first because it distorts the histogram and QQ plot used to judge normality.","key_concepts":[],"difficulty":null},{"start_s":1098.236,"end_s":1196.781,"segment_type":"example","title":"Worked Example 2: Diagnosing a Linearity Violation with Curvature","description":"Analyzes a second dataset where curvature in the scatter and residual plots reveals a linearity violation, while constant variance and normality look fine, so a more complex model would be needed.","key_concepts":[],"difficulty":null},{"start_s":1196.781,"end_s":1233.2,"segment_type":"summary","title":"Recap: Which Plot Checks Which Assumption","description":"Summarizes the diagnostic toolkit: scatter and residual plots check linearity and constant variance, QQ plots and histograms of residuals check normality, and the SRS assumption must come from how the data were collected.","key_concepts":[],"difficulty":null}]},{"id":"lec-566b8515084f","order":80,"title":"Chapter 13.7 Simple Linear Regression Model Inference - F-test","chapter":"13.7","video_provider":"youtube","video_id":"mTQ3GU9rpys","duration_s":1004.770433,"segments":[{"start_s":0.874,"end_s":46.915,"segment_type":"introduction","title":"From Diagnostics to Inference: Introducing the F-Test for Model Utility","description":"Recaps that once visual diagnostics confirm the assumptions, we can proceed to inference, and previews the F-test for model utility via the sum-of-squares decomposition.","key_concepts":[],"difficulty":null},{"start_s":46.915,"end_s":87.564,"segment_type":"concept_explanation","title":"The ANOVA Table and Sum-of-Squares Decomposition","description":"Presents the ANOVA table for a fitted regression — sums of squares, degrees of freedom, and mean squares — and motivates asking why the F ratio measures model utility.","key_concepts":[],"difficulty":null},{"start_s":87.564,"end_s":153.234,"segment_type":"concept_explanation","title":"Sum of Squares Total (SST): Variability Ignoring the Model","description":"Explains SST as the squared deviations of each observed y from y-bar, measuring total response variability while ignoring any information from the explanatory variable.","key_concepts":[],"difficulty":null},{"start_s":153.234,"end_s":250.484,"segment_type":"concept_explanation","title":"Sum of Squares Regression (SSR): Variability Explained by the Model","description":"Defines SSR as the squared distances between the predicted values and y-bar, and argues a useful model needs SSR large — if predictions collapse to y-bar, SSR goes to 0 and the model is useless.","key_concepts":[],"difficulty":null},{"start_s":250.484,"end_s":340.514,"segment_type":"deep_reasoning","title":"Rewriting SSR in Terms of the Slope b1","description":"Algebraically substitutes b0 = y-bar minus b1·x-bar to show SSR = b1-squared times the sum of (xi minus x-bar) squared, so a slope of 0 forces SSR to 0 and signals a useless model.","key_concepts":[],"difficulty":null},{"start_s":340.514,"end_s":484.503,"segment_type":"concept_explanation","title":"Sum of Squared Error (SSE): Residuals and Unexplained Variability","description":"Explains SSE as the sum of squared residuals that least squares minimized, and shows by plugging in y-hat that a slope of 0 makes SSE equal SST — so we want SSE small and SSR near SST.","key_concepts":[],"difficulty":null},{"start_s":484.503,"end_s":534.304,"segment_type":"summary","title":"Recap: SST = SSR + SSE and the Ideal Pattern","description":"Recaps the decomposition identity — SSR and SSE add up to SST (cross terms vanish) — and restates that a useful model has small SSE with SSR close to SST.","key_concepts":[],"difficulty":null},{"start_s":534.304,"end_s":704.144,"segment_type":"concept_explanation","title":"Degrees of Freedom: Why df Is 1 for Regression, n-2 for Error, n-1 Total","description":"Defines degrees of freedom as the number of values free to vary and explains why simple linear regression has df 1 for the regression component, n-2 for error, and n-1 total.","key_concepts":[],"difficulty":null},{"start_s":704.144,"end_s":781.976,"segment_type":"concept_explanation","title":"The F Statistic MSR/MSE and the Model Utility Hypotheses","description":"Forms the F statistic as mean squared regression over mean squared error with its right-skewed F distribution, and sets up the hypotheses of no linear association versus a linear association stated in context.","key_concepts":[],"difficulty":null},{"start_s":781.976,"end_s":888.287,"segment_type":"concept_explanation","title":"Step 3: Computing the F Statistic and Upper-Tail P-Value with pf in R","description":"Walks through filling in the ANOVA table to get the F statistic, then finding the always upper-tail p-value using R's pf function with lower.tail = FALSE under the null of no linear association.","key_concepts":[],"difficulty":null},{"start_s":888.287,"end_s":927.094,"segment_type":"concept_explanation","title":"Step 4: Decision and Conclusion About Linear Association","description":"Compares the p-value to alpha to make the decision and adapts the standard conclusion template to state whether there is evidence of a linear association between x and y.","key_concepts":[],"difficulty":null},{"start_s":927.094,"end_s":976.874,"segment_type":"example","title":"Finding the F-Test in R's summary() and anova() Output","description":"Shows that the F statistic and p-value appear in R's summary of a linear model fit and in the anova output, versus building the ANOVA table by hand when only summary measures are given.","key_concepts":[],"difficulty":null},{"start_s":976.874,"end_s":1001.4,"segment_type":"summary","title":"Closing: The F-Test Hinges on the Slope — Slope Test Is Next","description":"Recaps that model utility always traces back to whether b1 is 0 and previews the upcoming test of the slope as an alternative to the F-test.","key_concepts":[],"difficulty":null}]},{"id":"lec-ada47c407699","order":81,"title":"Chapter 13.8 Simple Linear Regression Model Inference - Slope and Intercept","chapter":"13.8","video_provider":"youtube","video_id":"_XCCR_oXcL0","duration_s":1241.073167,"segments":[{"start_s":1.08,"end_s":86.204,"segment_type":"introduction","title":"Why Test the Slope Directly? From F-Test to t-Test","description":"Motivates replacing the model utility F-test with a direct test of the slope, and explains when the intercept is worth testing versus when it has no physical meaning.","key_concepts":[],"difficulty":null},{"start_s":86.204,"end_s":320.004,"segment_type":"deep_reasoning","title":"Rewriting b0 and b1 as Weighted Averages of the Responses","description":"Derives, via the y-bar cancellation trick, that both least-squares estimators are linear combinations of the random responses Yi, so normality of the errors carries over to b0 and b1.","key_concepts":[],"difficulty":null},{"start_s":320.004,"end_s":446.184,"segment_type":"deep_reasoning","title":"Sampling Distribution of the Intercept b0","description":"Shows that b0 is an unbiased estimator of the true intercept and derives its variance sigma^2(1/n + x-bar^2/Sxx), concluding b0 is normally distributed.","key_concepts":[],"difficulty":null},{"start_s":446.184,"end_s":541.909,"segment_type":"deep_reasoning","title":"Sampling Distribution of the Slope b1","description":"Shows that b1 is an unbiased estimator of the true slope beta1 with variance sigma^2/Sxx, and is normally distributed under the model assumptions.","key_concepts":[],"difficulty":null},{"start_s":541.909,"end_s":629.677,"segment_type":"concept_explanation","title":"Unknown Sigma-Squared: Plugging in MSE and Moving to the t Distribution","description":"Explains that estimating the unknown sigma^2 with the mean squared error adds uncertainty, so inference for the slope uses a Student's t distribution with n-2 degrees of freedom.","key_concepts":[],"difficulty":null},{"start_s":629.677,"end_s":703.983,"segment_type":"concept_explanation","title":"Confidence Interval for the True Slope","description":"Builds the C-percent confidence interval for beta1 as b1 plus or minus a qt critical value (n-2 df) times the standard error sqrt(MSE/Sxx).","key_concepts":[],"difficulty":null},{"start_s":703.983,"end_s":880.913,"segment_type":"concept_explanation","title":"Four-Step Hypothesis Test for the Slope","description":"Walks through the full four-step test for beta1 — parameter of interest, hypotheses with null value beta_10, the t test statistic with n-2 df and pt p-value, and the formal conclusion — noting the CI zero-check shortcut.","key_concepts":[],"difficulty":null},{"start_s":880.913,"end_s":947.493,"segment_type":"deep_reasoning","title":"Equivalence of the Slope t-Test and the F-Test (t-squared = F)","description":"Shows that when testing slope zero versus non-zero, squaring the t statistic gives MSR/MSE, so the t-test and model utility F-test are the same test in simple linear regression.","key_concepts":[],"difficulty":null},{"start_s":947.493,"end_s":1038.268,"segment_type":"concept_explanation","title":"Why Both Tests Matter: t vs F in Multiple Regression","description":"Explains that with several explanatory variables the t-test only checks each slope individually while the F-test assesses all slopes simultaneously, so both tests are needed beyond simple linear regression.","key_concepts":[],"difficulty":null},{"start_s":1038.268,"end_s":1150.866,"segment_type":"example","title":"Fitting the Regression in R with lm()","description":"Demonstrates the lm(response ~ explanatory, data) syntax and how to extract fit$coefficients, fit$residuals, and fitted values from the fitted model object.","key_concepts":[],"difficulty":null},{"start_s":1150.866,"end_s":1211.22,"segment_type":"example","title":"Inference Output in R: summary() and the ANOVA Table","description":"Shows how summary(fit) reports R-squared, the F statistic, and slope/intercept t-tests with p-values, and how summary(aov(fit)) reproduces the ANOVA table including MSE as the estimate of sigma^2.","key_concepts":[],"difficulty":null},{"start_s":1211.22,"end_s":1239.9,"segment_type":"summary","title":"Recap: Workflow With and Without Raw Data","description":"Recaps the two workflows — let R do everything after checking assumptions, or build the ANOVA table and test statistics by hand from given sums of squares — and previews using the model next.","key_concepts":[],"difficulty":null}]},{"id":"lec-1bc4783f330b","order":82,"title":"Chapter 13.9 Prediction and Uncertainty - Confidence Intervals for the Mean Response at a Point_Prediction Intervals at a Point","chapter":"13.9","video_provider":"youtube","video_id":"zUyxH0AL530","duration_s":1757.088667,"segments":[{"start_s":0.698,"end_s":69.008,"segment_type":"introduction","title":"From Model Validation to Prediction: Lecture Overview","description":"Recaps the regression workflow (assumptions, inference, R-squared) and frames this lecture's goal: using the model for prediction and quantifying the uncertainty in those predictions.","key_concepts":[],"difficulty":null},{"start_s":69.008,"end_s":222.774,"segment_type":"example","title":"Fuel Efficiency Example: Which Predictions Can We Trust?","description":"Uses the cylinder-volume vs. horsepower data to show a trustworthy prediction at 2.25L (137.31 hp, inside the data range) versus an untrustworthy go-kart prediction at 0.25L outside the fitted range.","key_concepts":[],"difficulty":null},{"start_s":222.774,"end_s":319.139,"segment_type":"concept_explanation","title":"Interpolation vs. Extrapolation Regions","description":"Defines the interpolation region (safe, trustworthy predictions within the fitted x range) versus the extrapolation region, and warns to caveat any predictions made outside the data.","key_concepts":[],"difficulty":null},{"start_s":319.139,"end_s":398.369,"segment_type":"concept_explanation","title":"Confidence Intervals for the Mean Response: What They Estimate","description":"Introduces the first of two prediction scenarios: a confidence interval for the mean response mu_Y given x = x*, which quantifies uncertainty in the line's average behavior at a point, with no error term involved.","key_concepts":[],"difficulty":null},{"start_s":398.369,"end_s":501.482,"segment_type":"concept_explanation","title":"Prediction Intervals for a New Response: Why They're Wider","description":"Introduces prediction intervals for a new response value, explaining they must account for both the uncertainty in estimating the mean response line and the random variability of responses around it.","key_concepts":[],"difficulty":null},{"start_s":501.482,"end_s":689.412,"segment_type":"deep_reasoning","title":"Deriving Mu-hat-star as a Weighted Average and Its Unbiasedness","description":"Algebraically rewrites the predicted mean response b0 + b1·x* as a weighted average of the Yi's and shows its expected value equals the true mean response line at x* (unbiasedness).","key_concepts":[],"difficulty":null},{"start_s":689.412,"end_s":891.072,"segment_type":"deep_reasoning","title":"Deriving the Variance of the Mean Response Estimator","description":"Expands the squared weight terms, cancels the cross term, and derives Var(mu-hat-star) = sigma-squared times (1/n + (x* - x-bar)^2 / Sxx).","key_concepts":[],"difficulty":null},{"start_s":891.072,"end_s":943.242,"segment_type":"concept_explanation","title":"Interpreting the Variance: Distance from x-bar Drives Uncertainty","description":"Interprets the variance formula: uncertainty is smallest when x* equals x-bar and grows as x* moves toward the extrapolation region.","key_concepts":[],"difficulty":null},{"start_s":943.242,"end_s":1052.795,"segment_type":"concept_explanation","title":"Confidence Interval Formula: t Distribution with MSE Standard Error","description":"Assembles the CI for the mean response: normality gives a normal sampling distribution, unknown sigma-squared is estimated by MSE, yielding a t interval with n-2 degrees of freedom around b0 + b1·x*.","key_concepts":[],"difficulty":null},{"start_s":1052.795,"end_s":1249.481,"segment_type":"deep_reasoning","title":"Deriving the Prediction Interval Variance: The Extra Sigma-Squared","description":"Shows the new-response predictor is still unbiased but its variance adds an extra sigma-squared term (the '+1') for the response's own variability, which no sample size can eliminate.","key_concepts":[],"difficulty":null},{"start_s":1249.481,"end_s":1320.107,"segment_type":"concept_explanation","title":"Prediction Interval Formula and Its Wider Standard Error","description":"Constructs the prediction interval using the same t distribution and point estimate as the CI, differing only in the larger standard error that makes the interval wider.","key_concepts":[],"difficulty":null},{"start_s":1320.107,"end_s":1425.087,"segment_type":"concept_explanation","title":"Confidence Bands Along the Regression Line","description":"Defines confidence bands as the collection of mean-response confidence intervals across x values, capturing where the true regression line would plausibly lie under repeated sampling.","key_concepts":[],"difficulty":null},{"start_s":1425.087,"end_s":1479.024,"segment_type":"concept_explanation","title":"Prediction Bands for New Responses","description":"Defines prediction bands as prediction intervals at each x value, capturing the true response itself and therefore inherently wider than confidence bands.","key_concepts":[],"difficulty":null},{"start_s":1479.024,"end_s":1554.834,"segment_type":"common_mistakes","title":"The Multiple Testing Caveat for Bands","description":"Warns that constructing intervals at every x is technically a multiple testing problem inflating overall Type 1 error, though in simple regression the bands are conventionally treated as individual intervals.","key_concepts":[],"difficulty":null},{"start_s":1554.834,"end_s":1728.594,"segment_type":"example","title":"Scatter Plot Demonstration: Reading Confidence and Prediction Bands","description":"Walks through a scatter plot showing confidence bands tightest at x-bar and widening outward without capturing data points, versus much wider prediction bands that enclose nearly all observations.","key_concepts":[],"difficulty":null},{"start_s":1728.594,"end_s":1755.8,"segment_type":"summary","title":"Recap and Preview: What If Normality Fails?","description":"Recaps the prediction workflow (interpolate, verify assumptions, build intervals and bands) and previews the next lecture on what to do when normality fails.","key_concepts":[],"difficulty":null}]},{"id":"lec-3858af013957","order":83,"title":"Chapter 13.10 Robustness to Normality Assumptions","chapter":"13.10","video_provider":"youtube","video_id":"J8NtyRd48QU","duration_s":495.2948,"segments":[{"start_s":0.177,"end_s":68.48,"segment_type":"introduction","title":"Why Normality Matters: CLT Recap and the Prediction Interval Exception","description":"Recaps how the central limit theorem rescued earlier inference procedures under non-normal populations and previews that regression inference is similarly robust except for prediction intervals, which depend on an individual new error.","key_concepts":[],"difficulty":null},{"start_s":68.48,"end_s":147.314,"segment_type":"deep_reasoning","title":"Slope and Intercept as Weighted Averages: Normality Under Model Assumptions","description":"Derives that b0 and b1 are linear combinations of the independent responses yi, so if the error terms are truly normal, both estimators are exactly normally distributed.","key_concepts":[],"difficulty":null},{"start_s":147.314,"end_s":288.018,"segment_type":"concept_explanation","title":"CLT Robustness of Slope and Intercept Inference to Non-Normal Errors","description":"Explains that because the slope and intercept are weighted averages, the central limit theorem still makes them approximately normal for large n, so t-based tests and confidence intervals remain trustworthy under mild normality violations.","key_concepts":[],"difficulty":null},{"start_s":288.018,"end_s":388.152,"segment_type":"concept_explanation","title":"Mean Response Confidence Intervals Stay Robust via the CLT","description":"Re-expresses the mean response estimate and the new-point prediction as linear combinations of the yi, and argues that mean response confidence intervals remain reliable with large samples because the estimate is just a weighted average.","key_concepts":[],"difficulty":null},{"start_s":388.152,"end_s":456.314,"segment_type":"deep_reasoning","title":"Why Prediction Intervals Are NOT Robust: The Extra Error Term","description":"Shows that a new-response prediction adds an individual error term that keeps the population's non-normal distribution, so the CLT cannot be invoked and increasing the sample size will not fix untrustworthy prediction interval coverage.","key_concepts":[],"difficulty":null},{"start_s":456.314,"end_s":494.0,"segment_type":"summary","title":"Closing Caution: Interpret Prediction Intervals Carefully","description":"Recaps that under normality violations prediction intervals' empirical coverage may miss the nominal confidence level, so the normality assumption must be verified before trusting new-response intervals.","key_concepts":[],"difficulty":null}]},{"id":"lec-f793ec153b46","order":84,"title":"Chapter 13.11 Linear Regression Prediction Example - Cetane Number","chapter":"13.11","video_provider":"youtube","video_id":"XiQd9bhOSl4","duration_s":1325.324,"segments":[{"start_s":1,"end_s":119.474,"segment_type":"introduction","title":"Cetane Number Prediction Problem Setup and Analysis Plan","description":"Introduces the capstone example of predicting the cetane number of 14 biodiesel fuels from iodine value and outlines the plan to visualize the data, check assumptions, and fit the regression.","key_concepts":[],"difficulty":null},{"start_s":119.474,"end_s":243.704,"segment_type":"example","title":"Building and Reading the Scatter Plot in ggplot","description":"Constructs the iodine value vs cetane number scatter plot in R with ggplot and geom_point, then reads off a downward linear trend with no curvature.","key_concepts":[],"difficulty":null},{"start_s":243.704,"end_s":373.134,"segment_type":"example","title":"Fitting the Line with lm() and Extracting Coefficients, Predictions, and Residuals","description":"Fits the regression with lm(), pulls intercept and slope from the coefficients, and shows two ways to get y-hats and residuals, including fitted.values.","key_concepts":[],"difficulty":null},{"start_s":373.134,"end_s":463.054,"segment_type":"example","title":"Overlaying the Fitted Line and Purple Fitted Points on the Scatter Plot","description":"Adds the regression line with geom_abline, colors the fitted values purple to compare against observed responses, and labels the equation using latex2exp.","key_concepts":[],"difficulty":null},{"start_s":463.054,"end_s":610.592,"segment_type":"example","title":"Residual Plot and the Constant Variance Check","description":"Builds the residual-vs-iodine-value plot and interprets it, flagging a possible mild constant-variance violation while noting only 14 observations are available.","key_concepts":[],"difficulty":null},{"start_s":610.592,"end_s":741.484,"segment_type":"example","title":"Histogram of Residuals with Normal Curve for the Normality Check","description":"Plots a density histogram of the residuals with a kernel curve and best-fitting normal curve superimposed, concluding normality looks reasonable with no outliers.","key_concepts":[],"difficulty":null},{"start_s":741.484,"end_s":812.923,"segment_type":"example","title":"QQ Plot of the Residuals","description":"Constructs the QQ plot with stat_qq and a reference line and judges the slight wiggles as no serious normality violation given the small sample.","key_concepts":[],"difficulty":null},{"start_s":812.923,"end_s":865.695,"segment_type":"summary","title":"Assumption Check Verdict Across All Four Diagnostic Plots","description":"Recaps the scatter plot, residual plot, histogram, and QQ plot to conclude that assumptions are roughly satisfied but a possible constant-variance issue should be disclosed in any report.","key_concepts":[],"difficulty":null},{"start_s":865.695,"end_s":1009.521,"segment_type":"example","title":"99% Confidence and Prediction Intervals at Iodine Value 75 with predict()","description":"Shows how to build a new data frame and use R's predict() with interval = confidence or prediction and level = 0.99 to get intervals for the mean response and a new response at x = 75.","key_concepts":[],"difficulty":null},{"start_s":1009.521,"end_s":1078.101,"segment_type":"example","title":"Reading the Interval Output: Prediction Interval Wider Than Confidence Interval","description":"Interprets the predict() output, noting both intervals share the same fitted value near 60 while the prediction interval extends about 5 units further on each side.","key_concepts":[],"difficulty":null},{"start_s":1078.101,"end_s":1258.332,"segment_type":"example","title":"Plotting Confidence and Prediction Bands with geom_ribbon","description":"Computes intervals at every observed iodine value and draws confidence and prediction bands with geom_line and geom_ribbon, showing the bands bow inward in the middle and widen at the edges.","key_concepts":[],"difficulty":null},{"start_s":1258.332,"end_s":1324.0,"segment_type":"summary","title":"Course Wrap-Up: From Population Models to Statistical Inference","description":"Closes the course by urging students to review the arc from known populations and probability through sampling distributions to inference for one population, several populations, and two quantitative variables.","key_concepts":[],"difficulty":null}]}],"typeLabels":{"introduction":"introduction","concept_explanation":"concept explanation","example":"example","deep_reasoning":"deep reasoning","common_mistakes":"common mistakes","practice_problem":"practice problem","real_world_application":"real world application","summary":"summary","q_and_a":"q and a","transition":"transition"}}</script>
<script>
"use strict";
var DATA = JSON.parse(document.getElementById("data").textContent);
var THEME_KEY = "scriptorium-explorer-theme";
var byId = {};
DATA.lectures.forEach(function (lec) { byId[lec.id] = lec; });

var searchInput = document.getElementById("search");
var lectureNav = document.getElementById("lecture-nav");
var segmentPane = document.getElementById("segment-pane");
var playerCard = document.getElementById("player-card");
var vnTitle = document.getElementById("vn-title");
var vnBody = document.getElementById("vn-body");
var videoNotice = document.getElementById("video-notice");
var nowTitle = document.getElementById("now-title");
var nowMeta = document.getElementById("now-meta");
var nowSeg = document.getElementById("now-seg");
var nowDot = document.getElementById("now-dot");
var nowSegText = document.getElementById("now-seg-text");

var state = {
  currentLectureId: null,   // lecture shown in the pane
  playerLectureId: null,    // lecture whose video is (or will be) in the player
  view: "lecture",          // "lecture" | "search"
  apiReady: false,
  player: null,
  playerReady: false,
  pending: null,            // queued {lecId, startS, autoplay} until the API is up
  offline: false,
  pollTimer: null,
  activeSegIdx: -1,
  segCards: [],             // seg-card elements for the current lecture view
  searchTimer: null
};

/* ---------------- helpers ---------------- */
function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function sampleConcept() {
  // A search hint drawn from THIS course's own vocabulary, never hardcoded.
  for (var i = 0; i < DATA.lectures.length; i++) {
    var segs = DATA.lectures[i].segments;
    for (var j = 0; j < segs.length; j++) {
      if (segs[j].key_concepts.length) return segs[j].key_concepts[0];
    }
  }
  return null;
}
function tc(s) {
  s = Math.max(0, Math.floor(s || 0));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  var mm = h ? String(m).padStart(2, "0") : String(m);
  return (h ? h + ":" + mm : mm) + ":" + String(sec).padStart(2, "0");
}
function chapterOf(lec) {
  if (!lec.chapter) return "General";
  return "Chapter " + String(lec.chapter).split(".")[0];
}
function lectureMeta(lec) {
  var bits = [];
  if (lec.duration_s) bits.push(Math.round(lec.duration_s / 60) + " min");
  bits.push(lec.segments.length + " segments");
  return bits.join(" · ");
}
function hasVideo(lec) { return lec.video_provider === "youtube" && !!lec.video_id; }

/* ---------------- theme toggle (persisted, pre-paint applied in <head>) --- */
document.getElementById("theme-toggle").addEventListener("click", function () {
  var explicit = document.documentElement.getAttribute("data-theme");
  var isDark = explicit
    ? explicit === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  var next = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
});

/* ---------------- YouTube IFrame API (the one external script) ----------- */
function loadYouTubeAPI() {
  if (window.YT && window.YT.Player) { state.apiReady = true; return; }
  if (navigator.onLine === false) { setOffline(); return; }
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.async = true;
  tag.onerror = function () { setOffline(); };
  document.head.appendChild(tag);
  setTimeout(function () {
    if (!state.apiReady && !(window.YT && window.YT.Player)) notice("offline");
  }, 8000);
}
window.onYouTubeIframeAPIReady = function () {
  state.apiReady = true;
  state.offline = false;
  if (state.pending) {
    var a = state.pending; state.pending = null;
    var lec = byId[a.lecId];
    if (lec && hasVideo(lec)) requestVideo(lec, a.startS, a.autoplay);
  }
};
function setOffline() {
  state.offline = true;
  var lec = byId[state.currentLectureId];
  if (lec && hasVideo(lec)) notice("offline");
}

function createPlayer(lec, action) {
  notice("loading");
  state.player = new YT.Player("yt-player", {
    width: "100%", height: "100%",
    videoId: lec.video_id,
    playerVars: {
      autoplay: 0, playsinline: 1, rel: 0, modestbranding: 1,
      start: Math.floor(action.startS || 0)
    },
    events: {
      onReady: function () {
        state.playerReady = true;
        notice(null);
        if (action.autoplay) { try { state.player.playVideo(); } catch (e) {} }
        if (state.pending) {
          var a = state.pending; state.pending = null;
          var l = byId[a.lecId];
          if (l && hasVideo(l)) requestVideo(l, a.startS, a.autoplay);
        }
        startPoll();
      },
      onError: function () { notice("error"); }
    }
  });
}

/* Load or cue a lecture's video into the ONE persistent player. Queues the
   action when the IFrame API or the player is not ready yet. */
function requestVideo(lec, startS, autoplay) {
  state.playerLectureId = lec.id;
  if (state.offline) { notice("offline"); return; }
  var action = { lecId: lec.id, startS: startS || 0, autoplay: !!autoplay };
  if (!state.apiReady || !(window.YT && window.YT.Player)) {
    state.pending = action; notice("loading"); return;
  }
  if (!state.player) { createPlayer(lec, action); return; }
  if (!state.playerReady) { state.pending = action; return; }
  var arg = { videoId: lec.video_id, startSeconds: Math.floor(action.startS) };
  try {
    if (action.autoplay) state.player.loadVideoById(arg);
    else state.player.cueVideoById(arg);
    notice(null);
  } catch (e) { notice("error"); }
}

/* Segment click inside the current lecture: live seek, no iframe reload. */
function seekToSegment(seg) {
  var lec = byId[state.currentLectureId];
  if (!lec || !hasVideo(lec)) return;
  if (state.player && state.playerReady && state.playerLectureId === lec.id) {
    try {
      state.player.seekTo(seg.start_s, true);
      state.player.playVideo();
    } catch (e) { requestVideo(lec, seg.start_s, true); }
  } else {
    requestVideo(lec, seg.start_s, true);
  }
  playerCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

var NOTICES = {
  loading: ["Connecting to YouTube", "The player is loading. The segment list already works."],
  offline: ["Player unavailable offline", "Browsing and search still work. Video playback needs an internet connection."],
  novideo: ["No video linked yet", "This lecture has segments, but no video has been attached."],
  error:   ["Video failed to load", "YouTube could not play this video. Check your connection and reload."]
};
function notice(kind) {
  if (!kind) { videoNotice.hidden = true; return; }
  vnTitle.textContent = NOTICES[kind][0];
  vnBody.textContent = NOTICES[kind][1];
  videoNotice.hidden = false;
}

/* ---------------- 500 ms getCurrentTime() poll: active segment + progress */
function startPoll() {
  if (state.pollTimer) return;
  state.pollTimer = setInterval(pollTick, 500);
}
function pollTick() {
  if (!state.player || !state.playerReady || state.view !== "lecture") return;
  if (!state.playerLectureId || state.playerLectureId !== state.currentLectureId) return;
  var lec = byId[state.currentLectureId];
  if (!lec) return;
  var t;
  try { t = state.player.getCurrentTime() || 0; } catch (e) { return; }
  var idx = -1;
  for (var i = 0; i < lec.segments.length; i++) {
    var s = lec.segments[i];
    if (t >= s.start_s && t < s.end_s) { idx = i; break; }
  }
  setActiveSegment(lec, idx, t);
}
function setActiveSegment(lec, idx, t) {
  if (idx !== state.activeSegIdx) {
    var old = state.segCards[state.activeSegIdx];
    if (old) {
      old.classList.remove("playing");
      old.querySelector(".seg-progress i").style.width = "0";
    }
    state.activeSegIdx = idx;
    if (idx >= 0 && state.segCards[idx]) state.segCards[idx].classList.add("playing");
    if (idx >= 0) {
      var seg = lec.segments[idx];
      nowDot.style.background = "var(--seg-" + seg.segment_type + ")";
      nowSegText.textContent = "Now playing · " + seg.title;
      nowSeg.hidden = false;
    } else {
      nowSeg.hidden = true;
    }
  }
  if (idx >= 0 && state.segCards[idx]) {
    var sg = lec.segments[idx];
    var span = Math.max(sg.end_s - sg.start_s, 0.001);
    var pct = Math.min(100, Math.max(0, ((t - sg.start_s) / span) * 100));
    state.segCards[idx].querySelector(".seg-progress i").style.width = pct + "%";
  }
}

/* ---------------- rendering ---------------- */
function renderNav() {
  lectureNav.innerHTML = '<p class="rail-label">Lectures</p>';
  var groups = {}, order = [];
  DATA.lectures.forEach(function (lec) {
    var ch = chapterOf(lec);
    if (!groups[ch]) { groups[ch] = []; order.push(ch); }
    groups[ch].push(lec);
  });
  order.forEach(function (ch) {
    var h = document.createElement("p");
    h.className = "chapter-h";
    h.textContent = ch;
    lectureNav.appendChild(h);
    groups[ch].forEach(function (lec) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "lec-item";
      b.dataset.lectureId = lec.id;
      b.innerHTML =
        '<span class="lec-order">' + esc(lec.order) + "</span>" +
        '<span class="lec-body"><span class="lec-title">' + esc(lec.title) + "</span>" +
