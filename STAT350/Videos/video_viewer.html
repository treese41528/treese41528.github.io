        '<span class="lec-meta">' + esc(lectureMeta(lec)) + "</span></span>";
      b.addEventListener("click", function () {
        if (lec.id !== state.currentLectureId) selectLecture(lec.id, {});
        else if (state.view === "search") clearSearch();
      });
      lectureNav.appendChild(b);
    });
  });
}
function updateNavActive() {
  var items = lectureNav.querySelectorAll(".lec-item");
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle("active", items[i].dataset.lectureId === state.currentLectureId);
  }
}

function segCard(lec, seg, withContext) {
  var card = document.createElement("button");
  card.type = "button";
  card.className = "seg-card";
  card.style.setProperty("--hue", "var(--seg-" + seg.segment_type + ")");
  card.style.setProperty("--hue-soft", "var(--seg-" + seg.segment_type + "-soft)");
  card.setAttribute("aria-label", "Play “" + seg.title + "” at " + tc(seg.start_s));
  var label = DATA.typeLabels[seg.segment_type] || seg.segment_type;
  var context = withContext
    ? '<span class="seg-context">' +
        esc((lec.chapter ? "Ch " + lec.chapter + " · " : "") + lec.title) + "</span>"
    : "";
  card.innerHTML =
    '<span class="seg-time">' + tc(seg.start_s) + "</span>" +
    '<span class="seg-main">' + context +
      '<span class="seg-head"><span class="seg-type">' + esc(label) + "</span>" +
        (seg.difficulty
          ? '<span class="seg-diff"><span class="dot ' + esc(seg.difficulty) + '"></span>' +
            esc(seg.difficulty) + "</span>"
          : "") + "</span>" +
      '<span class="seg-title">' + esc(seg.title) + "</span>" +
      '<span class="seg-desc">' + esc(seg.description) + "</span>" +
      (seg.key_concepts.length
        ? '<span class="seg-chips">' + seg.key_concepts.slice(0, 5).map(function (c) {
            return '<span class="chip">' + esc(c) + "</span>";
          }).join("") + "</span>"
        : "") +
    "</span>" +
    '<span class="seg-progress" aria-hidden="true"><i></i></span>';
  return card;
}

function renderSegments(lec) {
  state.view = "lecture";
  setSearching(false);
  state.segCards = [];
  state.activeSegIdx = -1;
  segmentPane.innerHTML = "";
  var head = document.createElement("div");
  head.className = "pane-head";
  head.innerHTML = "<h3>Segments</h3>" +
    '<span class="pane-count">' + lec.segments.length + " in this lecture</span>";
  segmentPane.appendChild(head);
  var list = document.createElement("div");
  list.className = "seg-list";
  lec.segments.forEach(function (seg) {
    var card = segCard(lec, seg, false);
    card.addEventListener("click", function () { seekToSegment(seg); });
    state.segCards.push(card);
    list.appendChild(card);
  });
  segmentPane.appendChild(list);
}

function renderPlayerMeta(lec) {
  nowTitle.textContent = lec.title;
  var bits = [];
  if (lec.chapter) bits.push("Chapter " + lec.chapter);
  nowMeta.textContent = bits.concat(lectureMeta(lec)).join(" · ");
  nowSeg.hidden = true;
}

function selectLecture(id, opts) {
  var lec = byId[id];
  if (!lec) return;
  opts = opts || {};
  state.currentLectureId = id;
  updateNavActive();
  renderPlayerMeta(lec);
  renderSegments(lec);
  if (hasVideo(lec)) {
    requestVideo(lec, opts.startS || 0, !!opts.autoplay);
  } else {
    state.playerLectureId = null;
    if (state.player && state.playerReady) { try { state.player.stopVideo(); } catch (e) {} }
    notice("novideo");
  }
  if (opts.focusSeg) {
    var idx = lec.segments.indexOf(opts.focusSeg);
    var card = state.segCards[idx];
    if (card) {
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      card.classList.add("flash");
      setTimeout(function () { card.classList.remove("flash"); }, 1500);
    }
  }
}

/* ---------------- search: multi-term AND, weighted ranking --------------- */
/* weights: segment title ×3, key concepts ×2, description ×1, lecture ×1 */
function scoreSegment(seg, lec, terms) {
  var title = seg.title.toLowerCase();
  var concepts = seg.key_concepts.join(" ").toLowerCase();
  var desc = seg.description.toLowerCase();
  var ltitle = lec.title.toLowerCase();
  var total = 0;
  for (var i = 0; i < terms.length; i++) {
    var t = terms[i], hit = 0;
    if (title.indexOf(t) >= 0) hit += 3;
    if (concepts.indexOf(t) >= 0) hit += 2;
    if (desc.indexOf(t) >= 0) hit += 1;
    if (ltitle.indexOf(t) >= 0) hit += 1;
    if (!hit) return 0; // every term must match somewhere
    total += hit;
  }
  return total;
}

function runSearch(query) {
  var terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  var hits = [];
  DATA.lectures.forEach(function (lec) {
    lec.segments.forEach(function (seg) {
      var sc = scoreSegment(seg, lec, terms);
      if (sc > 0) hits.push({ sc: sc, lec: lec, seg: seg });
    });
  });
  hits.sort(function (a, b) {
    return b.sc - a.sc || a.lec.order - b.lec.order || a.seg.start_s - b.seg.start_s;
  });
  renderResults(query, hits);
}

function renderResults(query, hits) {
  state.view = "search";
  setSearching(true);
  state.segCards = [];
  state.activeSegIdx = -1;
  segmentPane.innerHTML = "";
  var head = document.createElement("div");
  head.className = "pane-head";
  head.innerHTML = "<h3>Search results</h3>" +
    '<span class="pane-count">' + hits.length + " for “" + esc(query) + "”</span>";
  segmentPane.appendChild(head);
  if (!hits.length) {
    var empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>' +
      '<p class="empty-title">No matches for “' + esc(query) + "”</p>" +
      '<p class="empty-hint">Try a broader term' +
      (sampleConcept() ? ", or a concept name like “" + esc(sampleConcept()) + "”." : ".") +
      "</p>";
    segmentPane.appendChild(empty);
    return;
  }
  var list = document.createElement("div");
  list.className = "seg-list";
  hits.slice(0, 60).forEach(function (h) {
    var card = segCard(h.lec, h.seg, true);
    card.addEventListener("click", function () {
      searchInput.value = "";
      selectLecture(h.lec.id, { startS: h.seg.start_s, autoplay: true, focusSeg: h.seg });
    });
    list.appendChild(card);
  });
  segmentPane.appendChild(list);
}

function setSearching(on) {
  // While a search is active the player yields the stage entirely: results
  // get the full pane, and the video (if playing) pauses. Picking a result
  // brings the player back at that segment.
  document.body.classList.toggle("searching", on);
  if (on && state.player && state.playerReady) {
    try {
      if (state.player.getPlayerState && state.player.getPlayerState() === 1) {
        state.player.pauseVideo();
      }
    } catch (e) {}
  }
}

function clearSearch() {
  searchInput.value = "";
  var lec = byId[state.currentLectureId];
  if (lec) { renderSegments(lec); }
}

function applySearch() {
  var q = searchInput.value.trim();
  if (q.length < 2) {
    if (state.view === "search") clearSearch();
    return;
  }
  runSearch(q);
}

searchInput.addEventListener("input", function () {
  clearTimeout(state.searchTimer);
  state.searchTimer = setTimeout(applySearch, 150); // debounce
});
searchInput.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    e.preventDefault();
    clearSearch();
    searchInput.blur();
  }
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
  var tag = (e.target && e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || (e.target && e.target.isContentEditable)) return;
  e.preventDefault();
  searchInput.focus();
  searchInput.select();
});

/* ---------------- init: first lecture selected, video cued --------------- */
renderNav();
if (DATA.lectures.length) {
  selectLecture(DATA.lectures[0].id, {});
  if (DATA.lectures.some(hasVideo)) loadYouTubeAPI();
} else {
  playerCard.hidden = true;
  segmentPane.innerHTML =
    '<div class="empty"><p class="empty-title">No segmented lectures yet</p>' +
    '<p class="empty-hint">Segments will appear here once lectures are processed.</p></div>';
}
</script>
</body>
